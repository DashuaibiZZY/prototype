<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP · 首页全状态原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #e5e7eb; margin: 0; padding: 32px 24px 48px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .gallery-header { max-width: 1200px; margin: 0 auto 28px; }
        .gallery-header h1 { font-size: 22px; font-weight: 900; color: #111827; letter-spacing: -0.02em; }
        .gallery-header p { font-size: 12px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
        .proto-grid { display: flex; flex-wrap: wrap; gap: 36px 28px; align-items: flex-start; justify-content: center; max-width: 1600px; margin: 0 auto; }
        .proto-panel { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .proto-label { width: 375px; font-size: 13px; font-weight: 800; color: #111827; line-height: 1.45; }
        .proto-label .desc { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-top: 4px; }
        .phone-shell {
            width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45); position: relative; border: 4px solid #333; flex-shrink: 0;
        }
        .screen {
            width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden;
            position: relative; display: flex; flex-direction: column;
        }
        .tab-active { color: #000; font-weight: 800; border-bottom: 2px solid #000; }
        .net-error-banner { background: #FEF2F2; color: #EF4444; }
        .error-modal-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px);
        }
        .equity-card { background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 14px; padding: 14px 16px; color: #111827; }
        .equity-label { font-size: 10px; font-weight: 700; color: #9ca3af; letter-spacing: 0.02em; }
        .equity-amount { font-size: 22px; font-weight: 900; line-height: 1.2; color: #111827; }
        .equity-change { font-size: 11px; font-weight: 700; }
        .equity-deposit-btn { background: #111827; color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 800; }
        .quick-entry-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .quick-entry-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 12px; text-decoration: none; color: #111827; }
        .quick-entry-icon {
            width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            background: #f9fafb; border: 1px solid #f3f4f6;
        }
        .quick-entry-icon svg { width: 20px; height: 20px; }
        .quick-entry-label { font-size: 10px; font-weight: 800; color: #374151; }
    </style>
</head>
<body>

<div class="gallery-header">
    <h1>APP 首页 · 全状态平铺原型</h1>
    <p>每个手机框代表一种独立页面状态，供 UI 设计对照。下方滚动区域为首页主体；开屏为单独一屏。</p>
</div>

<div class="proto-grid" id="proto-grid"></div>

function listRow(item) {
    // 已收藏列表 & 熱門/新币/漲幅/跌幅 Tab 行式卡片：无勾选框
    const row = `
        <div class="flex justify-between items-center py-1">
            <div>
                <p class="font-black text-sm">${item.symbol}</p>
                <p class="text-[10px] text-gray-400">${item.vol} USDT</p>
            </div>
            <div class="text-right flex-1 pr-6">
                <p class="font-bold text-sm">${item.price}</p>
            </div>
            <div class="${item.up ? 'bg-green-500' : 'bg-red-500'} text-white text-[11px] font-bold py-1.5 w-20 text-center rounded-lg shadow-sm">
                ${item.change}
            </div>
        </div>`;
    return row;
}

function favEmptyHtml() {
    const cards = favRecommend.map(c => `
        <div class="border border-gray-100 rounded-xl p-3 flex flex-col justify-between shadow-sm">
            <div class="flex justify-between items-start">
                <span class="font-black text-sm">${c.symbol}</span>
                <input type="checkbox" checked class="accent-black">
            </div>
            <div class="mt-4">
                <p class="text-lg font-black leading-none">${c.price}</p>
                <p class="${c.up ? 'text-green-500' : 'text-red-500'} text-[10px] font-bold mt-1">${c.change}</p>
            </div>
        </div>`).join('');
    return `
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3 mb-4">${cards}</div>
            <button type="button" class="w-full py-4 border-2 border-dashed border-gray-100 rounded-xl text-gray-400 text-[11px] font-bold flex items-center justify-center space-x-2">

                <span>一鍵收藏</span>
            </button>
        </div>`;
}

function favFilledHtml() {
    return `<div class="space-y-4">${favListData.map(i => listRow(i)).join('')}${viewMoreHtml}</div>`;
}

function listTabHtml(tabKey) {
    const data = marketTabData[tabKey] || favListData;
    return `<div class="space-y-4">${data.map(i => listRow(i)).join('')}${viewMoreHtml}</div>`;
}

function marketTabsHtml(activeTab) {
    const tabs = [
        { key: 'fav', label: '收藏' },
        { key: 'hot', label: '熱門' },
        { key: 'new', label: '新币上线' },
        { key: 'up', label: '漲幅榜' },
        { key: 'down', label: '跌幅榜' }
    ];
    const btns = tabs.map(t => {
        const cls = t.key === activeTab ? 'tab-active pb-2 text-[13px] transition-all shrink-0' : 'text-gray-400 pb-2 text-[13px] transition-all shrink-0';
        return `<span class="${cls}">${t.label}</span>`;
    }).join('');
    return `<div class="flex space-x-6 border-b border-gray-100 mb-4 overflow-x-auto whitespace-nowrap no-scrollbar">${btns}</div>`;
}

function marketContentHtml(activeTab, favMode) {
    if (activeTab === 'fav') {
        return favMode === 'empty' ? favEmptyHtml() : favFilledHtml();
    }
    return listTabHtml(activeTab);
}

    return `
        <div class="net-error-banner px-6 py-2 flex items-center space-x-2 shrink-0">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
            <span class="text-[10px] font-bold uppercase tracking-wider">網絡連接異常，請檢查您的網路設置</span>
        </div>`;
}

function marketErrorHtml() {
    return `
        <div class="py-20 flex flex-col items-center justify-center space-y-4">
            <div class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center text-gray-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </div>
            <button type="button" class="px-6 py-2 border border-gray-200 rounded-full text-xs font-bold text-gray-500">刷新頁面</button>
        </div>`;
}

function timeoutModalHtml() {
    return `
        <div class="error-modal-overlay">
            <div class="bg-white w-[280px] rounded-2xl p-6 shadow-2xl">
                <h3 class="text-base font-black text-center mb-2">請求超時</h3>
                <p class="text-xs text-gray-500 text-center leading-relaxed mb-6">請檢查您的網路狀態並重試</p>
                <button type="button" class="w-full py-3 bg-black text-white rounded-xl text-xs font-black uppercase tracking-widest">好的</button>
            </div>
        </div>`;
}

function splashScreenHtml() {
    return `
        <div class="screen">
            <div class="absolute inset-0 bg-white flex flex-col items-center justify-center">
                <div class="w-20 h-20 bg-black rounded-2xl flex items-center justify-center mb-4">
                    <span class="text-white text-4xl font-black italic">F</span>
                </div>
                <h1 class="text-2xl font-black tracking-tighter">ForX</h1>
                <p class="text-gray-400 text-xs mt-2">Next-Gen Perp DEX</p>
            </div>
        </div>`;
}

function homeScreenHtml(cfg) {
    const {
        loggedIn = false,
        assetHidden = false,
        activeTab = 'fav',
        favMode = 'filled',
        showAnnouncements = true,
        netError = false
    } = cfg;

    let scrollContent = '';

    if (netError) {
        scrollContent = marketErrorHtml();
    } else {
        const hero = loggedIn ? heroLoggedIn(assetHidden) : heroLoggedOut();
        const quick = loggedIn ? `<section class="mb-2">${quickEntryHtml()}</section>` : '';
        const market = `
            <section>
                ${marketTabsHtml(activeTab)}
                ${marketContentHtml(activeTab, favMode)}
            </section>`;
        scrollContent = `
            <section class="mb-6">${hero}</section>
            ${quick}
            ${bannerHtml()}
            ${market}
            ${showAnnouncements ? announcementsHtml() : ''}`;
    }

    return `
        <div class="screen">
            ${headerHtml()}
            ${netError ? netErrorBarHtml() : ''}
            <div class="flex-1 overflow-y-auto no-scrollbar px-5 pb-20">${scrollContent}</div>
            ${bottomNavHtml()}
            ${netError ? timeoutModalHtml() : ''}
        </div>`;
}

const STATES = [
    {
        title: '① 开屏页',
        desc: 'App 启动闪屏，Logo + 品牌名，约 1.5s 后自动进入首页',
        render: () => splashScreenHtml()
    },
    {
        title: '② 首页 · 未登录',
        desc: '访客态：新人礼包 Hero + Banner + 收藏 Tab（默认无自选）+ 公告区',
        render: () => homeScreenHtml({ loggedIn: false, activeTab: 'fav', favMode: 'empty' })
    },
    {
        title: '③ 首页 · 已登录 · 资产可见',
        desc: '权益卡片展示金额与涨跌；快捷入口四宫格；收藏 Tab 已有自选列表',
        render: () => homeScreenHtml({ loggedIn: true, activeTab: 'fav', favMode: 'filled' })
    },
    {
        title: '④ 首页 · 已登录 · 资产已隐藏',
        desc: '点击眼睛图标后：金额显示 ******，涨跌行隐藏',
        render: () => homeScreenHtml({ loggedIn: true, assetHidden: true, activeTab: 'fav', favMode: 'filled' })
    },
    {
        title: '⑤ 收藏 · 无自选（推荐币对）',
        desc: '尚未收藏：2×3 推荐卡片带勾选框 + 底部「一鍵收藏」；已收藏及熱門/新币/漲幅/跌幅等 Tab 的行式列表无勾选框',
        render: () => homeScreenHtml({ loggedIn: true, activeTab: 'fav', favMode: 'empty' })
    },
    {
        title: '⑥ 收藏 · 已有自选（列表样式）',
        desc: '已收藏后：行式行情列表（无勾选框）+ 涨跌幅色块 + 查看更多',
        render: () => homeScreenHtml({ loggedIn: true, activeTab: 'fav', favMode: 'filled' })
    },
    {
        title: '⑦ 网络异常',
        desc: '顶部红色横幅 + 资产显示 -- + 行情区刷新失败 + 「請求超時」弹窗叠加',
        render: () => homeScreenHtml({ loggedIn: true, netError: true, showAnnouncements: false })
    }
];

const grid = document.getElementById('proto-grid');
STATES.forEach(state => {
    const panel = document.createElement('div');
    panel.className = 'proto-panel';
    panel.innerHTML = `
        <div class="proto-label">${state.title}<span class="desc">${state.desc}</span></div>
        <div class="phone-shell">${state.render()}</div>`;
    grid.appendChild(panel);
});
</script>

</body>
</html>
