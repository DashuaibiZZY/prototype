<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP - 个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .phone-shell { width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; border: 4px solid #333; }
        .screen { width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .hub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .hub-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 12px; text-decoration: none; color: #111827; }
        .hub-item:active { background: #f3f4f6; }
        .hub-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #f9fafb; border: 1px solid #f3f4f6; }
        .hub-icon svg { width: 20px; height: 20px; }
        .hub-label { font-size: 10px; font-weight: 800; color: #374151; }
        .section-title { font-size: 11px; font-weight: 900; color: #9ca3af; letter-spacing: 0.06em; padding: 0 20px 8px; }
        .divider { height: 1px; background: #f3f4f6; margin: 4px 20px; }
        .profile-link { display: flex; align-items: center; gap: 12px; padding: 12px 20px; text-decoration: none; color: #111827; }
        .profile-link:active { background: #f9fafb; }
    </style>
</head>
<body>

<div class="phone-shell">
    <div class="screen flex flex-col bg-white">

        <header class="flex justify-between items-center px-5 pt-12 pb-2 shrink-0">
            <a href="首页.html" class="p-1 -ml-1" aria-label="返回">
                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <a href="设置.html" class="p-1" aria-label="设置">
                <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </a>
        </header>

        <div class="flex-1 overflow-y-auto no-scrollbar pb-8">

            <!-- 账户信息（可进入个人资料） -->
            <a href="个人资料.html" class="profile-link">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center shrink-0">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <div class="min-w-0 flex-1">
                    <p class="text-[14px] font-black text-gray-900">UID：10002345</p>
                    <p class="text-[12px] text-gray-400 font-medium mt-1 truncate">0x7a3f...9c2e</p>
                </div>
                <svg class="w-4 h-4 text-gray-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
            </a>

            <div class="divider"></div>

            <!-- 快捷入口 -->
            <p class="section-title mt-4">快捷入口</p>
            <div class="hub-grid px-3 pb-2">
                <a href="合约交易.html" class="hub-item">
                    <div class="hub-icon text-gray-800"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg></div>
                    <span class="hub-label">永续交易</span>
                </a>
                <a href="充值.html" class="hub-item">
                    <div class="hub-icon text-emerald-600"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg></div>
                    <span class="hub-label">充值</span>
                </a>
                <a href="提现.html" class="hub-item">
                    <div class="hub-icon text-orange-500"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg></div>
                    <span class="hub-label">提现</span>
                </a>
                <a href="#" class="hub-item" onclick="showToast('划转功能原型'); return false;">
                    <div class="hub-icon text-blue-600"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg></div>
                    <span class="hub-label">划转</span>
                </a>
            </div>

            <div class="divider"></div>

            <!-- 活动和奖励 -->
            <p class="section-title mt-4">活动和奖励</p>
            <div class="hub-grid px-3 pb-2">
                <a href="VIP费率等级.html" class="hub-item">
                    <div class="hub-icon text-amber-500"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg></div>
                    <span class="hub-label">VIP</span>
                </a>
                <a href="活动中心.html" class="hub-item">
                    <div class="hub-icon text-violet-600"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg></div>
                    <span class="hub-label">热门活动</span>
                </a>
                <a href="积分.html" class="hub-item">
                    <div class="hub-icon text-blue-600"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg></div>
                    <span class="hub-label">积分</span>
                </a>
                <a href="邀请返佣.html" class="hub-item">
                    <div class="hub-icon text-purple-600"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg></div>
                    <span class="hub-label">邀请赚币</span>
                </a>
                <a href="卡券中心.html" class="hub-item">
                    <div class="hub-icon text-emerald-600"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg></div>
                    <span class="hub-label">我的卡券</span>
                </a>
            </div>

            <div class="divider mt-2"></div>

            <!-- 更多 -->
            <p class="section-title mt-4">更多</p>
            <div class="hub-grid px-3 pb-4" style="grid-template-columns: repeat(2, 1fr); max-width: 50%;">
                <a href="消息中心.html" class="hub-item">
                    <div class="hub-icon text-gray-700"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.007-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg></div>
                    <span class="hub-label">公告</span>
                </a>
                <a href="#" class="hub-item" onclick="showToast('帮助文档'); return false;">
                    <div class="hub-icon text-gray-700"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></div>
                    <span class="hub-label">文档</span>
                </a>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity z-50">操作成功</div>

<script>
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0');
    setTimeout(() => t.classList.add('opacity-0'), 1800);
}
</script>
</body>
</html>
