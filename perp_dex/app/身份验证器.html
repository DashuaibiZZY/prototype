<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP · 身份验证器全状态原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #e5e7eb; margin: 0; padding: 32px 24px 48px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .gallery-header { max-width: 1200px; margin: 0 auto 28px; }
        .gallery-header h1 { font-size: 22px; font-weight: 900; color: #111827; letter-spacing: -0.02em; }
        .gallery-header p { font-size: 12px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
        .proto-grid { display: flex; flex-wrap: wrap; gap: 36px 28px; align-items: flex-start; justify-content: center; max-width: 1800px; margin: 0 auto; }
        .proto-panel { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .proto-label { width: 375px; font-size: 13px; font-weight: 800; color: #111827; line-height: 1.45; }
        .proto-label .desc { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-top: 4px; }
        .phone-shell {
            width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45); position: relative; border: 4px solid #333; flex-shrink: 0;
        }
        .screen {
            width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden;
            position: relative; display: flex; flex-direction: column;
        }
        .qr-box { width: 160px; height: 160px; margin: 0 auto; background: repeating-conic-gradient(#e5e7eb 0% 25%, #fff 0% 50%) 50% / 16px 16px; border: 1px solid #e5e7eb; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .code-input { width: 44px; height: 52px; text-align: center; font-size: 22px; font-weight: 900; border: 1px solid #e5e7eb; border-radius: 12px; background: #f9fafb; }
        .primary-btn { width: 100%; height: 48px; border-radius: 14px; background: #111827; color: #fff; font-size: 13px; font-weight: 800; border: none; }
        .secondary-btn { width: 100%; height: 48px; border-radius: 14px; background: #fff; color: #111827; font-size: 13px; font-weight: 800; border: 1px solid #e5e7eb; margin-top: 10px; }
        .danger-btn { width: 100%; height: 48px; border-radius: 14px; background: #fef2f2; color: #dc2626; font-size: 13px; font-weight: 800; border: 1px solid #fecaca; }
        .secret-key { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; background: #f3f4f6; padding: 10px 12px; border-radius: 10px; word-break: break-all; }
    </style>
</head>
<body>

<div class="gallery-header">
    <h1>身份验证器 · 全状态平铺原型</h1>
    <p>绑定 / 修改 / 移除全流程，每个手机框为独立步骤页面。</p>
</div>

<div class="proto-grid" id="proto-grid"></div>

<script>
function subHeader(title) {
    return `
        <header class="flex justify-between items-center px-5 pt-12 pb-3 shrink-0 bg-white border-b border-gray-50">
            <a href="个人资料.html?login=email" class="p-1 -ml-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <h1 class="font-black text-[15px]">${title}</h1>
            <div class="w-6"></div>
        </header>`;
}

function codeInputsHtml() {
    return `
        <div class="flex justify-center gap-2 mt-8">
            <input class="code-input" maxlength="1" type="text" readonly value="1">
            <input class="code-input" maxlength="1" type="text" readonly value="2">
            <input class="code-input" maxlength="1" type="text" readonly value="3">
            <input class="code-input" maxlength="1" type="text" readonly value="4">
            <input class="code-input" maxlength="1" type="text" readonly value="5">
            <input class="code-input" maxlength="1" type="text" readonly value="6">
        </div>`;
}

function viewNotSet() {
    return `
        ${subHeader('身份验证器 App')}
        <div class="flex-1 overflow-y-auto no-scrollbar px-5 pt-6 pb-8 bg-slate-50">
            <div class="w-16 h-16 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            </div>
            <h2 class="text-[17px] font-black text-gray-900 text-center">绑定身份验证器 App</h2>
            <p class="text-[12px] text-gray-500 text-center mt-2 leading-relaxed px-2">绑定后可使用动态验证码保护账户安全。</p>
            <p class="text-[10px] text-gray-400 text-center mt-5">支持 Google Authenticator、Microsoft Authenticator 等标准 TOTP 应用</p>
            <div class="mt-8">
                <button type="button" class="primary-btn">立即绑定</button>
            </div>
        </div>`;
}

function viewSetupQr() {
    return `
        ${subHeader('绑定验证器')}
        <div class="flex-1 overflow-y-auto no-scrollbar px-5 pt-5 pb-8 bg-slate-50">
            <p class="text-[12px] text-gray-500 text-center leading-relaxed">使用身份验证器 App 扫描下方二维码，或手动输入密钥</p>
            <div class="qr-box mt-5 mb-4">
                <span class="text-[10px] font-bold text-gray-400 bg-white px-2 py-1 rounded">QR Code</span>
            </div>
            <p class="text-[10px] font-bold text-gray-400 text-center uppercase tracking-wide">手动输入密钥</p>
            <p class="secret-key mt-2 text-center">JBSW Y3DP EHPK 3PXP</p>
            <button type="button" class="text-[11px] font-black text-blue-600 mx-auto block mt-2">复制密钥</button>
            <div class="mt-8">
                <button type="button" class="primary-btn">下一步</button>
            </div>
        </div>`;
}

function viewSetupVerify() {
    return `
        ${subHeader('验证绑定')}
        <div class="flex-1 overflow-y-auto no-scrollbar px-5 pt-6 pb-8 bg-slate-50">
            <p class="text-[13px] font-black text-gray-900 text-center">输入验证器中的 6 位验证码</p>
            <p class="text-[11px] text-gray-400 text-center mt-2">验证码每 30 秒更新一次</p>
            ${codeInputsHtml()}
            <div class="mt-10">
                <button type="button" class="primary-btn">确认绑定</button>
            </div>
        </div>`;
}

function viewBound() {
    return `
        ${subHeader('身份验证器 App')}
        <div class="flex-1 overflow-y-auto no-scrollbar px-5 pt-6 pb-8 bg-slate-50">
            <div class="bg-white border border-gray-100 rounded-2xl p-5 text-center">
                <div class="w-14 h-14 rounded-full bg-green-50 border border-green-100 flex items-center justify-center mx-auto mb-3">
                    <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </div>
                <p class="text-[15px] font-black text-gray-900">已绑定身份验证器</p>
                <p class="text-[11px] text-gray-400 mt-2 leading-relaxed">已启用动态验证码保护</p>
                <span class="inline-block mt-3 text-[10px] font-black text-green-700 bg-green-50 px-3 py-1 rounded-full border border-green-100">安全等级：高</span>
            </div>
            <div class="mt-6 space-y-3">
                <button type="button" class="secondary-btn !mt-0">修改验证器</button>
                <p class="text-[10px] text-gray-400 text-center px-2">更换手机或验证器 App 时需重新绑定</p>
                <button type="button" class="danger-btn !mt-0">移除验证器</button>
                <p class="text-[10px] text-gray-400 text-center px-2">移除后账户安全等级将降低</p>
            </div>
        </div>`;
}

function viewModify() {
    return `
        ${subHeader('修改验证器')}
        <div class="flex-1 overflow-y-auto no-scrollbar px-5 pt-6 pb-8 bg-slate-50">
            <p class="text-[13px] font-black text-gray-900 text-center">验证当前身份验证器</p>
            <p class="text-[11px] text-gray-400 text-center mt-2">请输入旧验证器中的 6 位动态码以继续</p>
            ${codeInputsHtml()}
            <div class="mt-10">
                <button type="button" class="primary-btn">下一步</button>
            </div>
        </div>`;
}

function viewRemove() {
    return `
        ${subHeader('移除验证器')}
        <div class="flex-1 overflow-y-auto no-scrollbar px-5 pt-6 pb-8 bg-slate-50">
            <div class="p-4 bg-red-50 border border-red-100 rounded-2xl mb-6">
                <p class="text-[12px] font-black text-red-800">安全风险提示</p>
                <p class="text-[11px] text-red-700 mt-1 leading-relaxed">移除后将无法使用验证器进行安全验证。建议仅在无法继续使用当前验证器时操作。</p>
            </div>
            <p class="text-[13px] font-black text-gray-900 text-center">输入验证器动态码确认移除</p>
            ${codeInputsHtml()}
            <div class="mt-10">
                <button type="button" class="danger-btn !mt-0">确认移除</button>
                <button type="button" class="secondary-btn">取消</button>
            </div>
        </div>`;
}

function screenHtml(bodyHtml) {
    return `<div class="screen flex flex-col bg-slate-50">${bodyHtml}</div>`;
}

const STATES = [
    { title: '① 未设置 · 引导绑定', desc: '首次进入：说明 TOTP 用途 +「立即绑定」按钮', render: () => screenHtml(viewNotSet()) },
    { title: '② 设置 · 扫码绑定', desc: '展示二维码占位 + 手动密钥 + 复制 + 下一步', render: () => screenHtml(viewSetupQr()) },
    { title: '③ 设置 · 验证码确认', desc: '输入 6 位验证码完成绑定', render: () => screenHtml(viewSetupVerify()) },
    { title: '④ 已设置 · 管理页', desc: '已绑定成功态；可修改或移除验证器', render: () => screenHtml(viewBound()) },
    { title: '⑤ 修改 · 验证旧码', desc: '更换验证器前验证当前 6 位动态码', render: () => screenHtml(viewModify()) },
    { title: '⑥ 移除 · 安全确认', desc: '风险提示 + 输入动态码确认移除', render: () => screenHtml(viewRemove()) }
];

const grid = document.getElementById('proto-grid');
STATES.forEach(state => {
    const panel = document.createElement('div');
    panel.className = 'proto-panel';
    panel.innerHTML = `
        <div class="proto-label">${state.title}<span class="desc">${state.desc}</span></div>
        <div class="phone-shell">${state.render()}</div>`;
    grid.appendChild(panel);
});
</script>

</body>
</html>
