    const body = role === 'agent'
        ? `${agentInfoBoxHtml()}${tier}${earningsHtml('agent')}${statsHtml('agent')}${ambassadorHtml()}`
        : `${tier}${earningsHtml('normal')}${statsHtml('normal')}${ambassadorHtml()}`;

    return `
        <div class="screen flex flex-col">
            ${headerHtml()}
            <div class="flex-1 overflow-y-auto no-scrollbar bg-slate-50">
                ${linkSectionHtml()}
                ${body}
            </div>
            ${shareModal ? shareModalHtml() : ''}
            ${infoType ? infoModalHtml(INFO_TEXT[infoType]) : ''}
        </div>`;
}

const STATES = [
    {
        title: '① 普通用户',
        desc: '完整等级进度、收益数据、直邀统计入口、大使申请 Banner',
        render: () => screenHtml({ role: 'normal' })
    },
    {
        title: '② 合伙人用户',
        desc: '顶部蓝色引导框 + 数据占位「--」；引导前往网页版合伙人管理中心',
        render: () => screenHtml({ role: 'agent' })
    },
    {
        title: '③ 分享海报弹窗',
        desc: '点击右上角分享：全屏海报预览 + 取消 / 分享海报按钮',
        render: () => screenHtml({ role: 'normal', shareModal: true })
    },
    {
        title: '④ 说明浮窗 · 待结算收益',
        desc: '点击「待结算收益」虚线：居中说明弹窗 + 「好的」按钮',
        render: () => screenHtml({ role: 'normal', infoType: 'pending' })
    },
    {
        title: '⑤ 说明浮窗 · 活跃好友',
        desc: '点击「活跃好友」虚线：说明活跃好友判定规则',
        render: () => screenHtml({ role: 'normal', infoType: 'active' })
    },
    {
        title: '⑥ 邀请链接落地 · Web 交易页弹窗',
        desc: 'Web：打开邀请链接进入合约交易页并弹出邀请码引导；背景为交易页示意，点击「连接钱包」进入注册流程',
        render: () => inviteLandingScreenHtml()
    }
];

const grid = document.getElementById('proto-grid');
STATES.forEach(state => {
    const panel = document.createElement('div');
    panel.className = 'proto-panel';
    panel.innerHTML = `
        <div class="proto-label">${state.title}<span class="desc">${state.desc}</span></div>
        <div class="phone-shell">${state.render()}</div>`;
    grid.appendChild(panel);
});
</script>

</body>
</html>
