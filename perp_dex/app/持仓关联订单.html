<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX - 关联订单</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-shell { width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; border: 4px solid #333; }
        .screen { width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .order-card { background: white; border-bottom: 1px solid #f3f4f6; padding: 16px 20px; }
        .copy-icon { width: 14px; height: 14px; color: #d1d5db; cursor: pointer; }
    </style>
</head>
<body>

<div class="phone-shell">
    <div class="screen">
        <header class="flex justify-between items-center px-4 pt-12 pb-4 shrink-0 bg-white border-b border-gray-50">
            <button onclick="window.history.back()" class="p-1 -ml-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg></button>
            <span class="font-black text-[15px]">关联订单</span>
            <div class="w-8"></div>
        </header>

        <div class="flex-1 overflow-y-auto no-scrollbar">
            <div class="px-5 py-5 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <p class="text-[9px] text-gray-400 font-bold uppercase">已实现盈亏 (USDT)</p>
                        <p class="text-[15px] font-black text-red-500">-579.30</p>
                    </div>
                    <div class="space-y-1 text-right">
                        <p class="text-[9px] text-gray-400 font-bold uppercase">已平倉量</p>
                        <p class="text-[15px] font-black text-gray-900">1.02 BNB</p>
                    </div>
                </div>
                <div class="space-y-3 text-[12px] font-bold">
                    <div class="flex justify-between"><span class="text-gray-400 text-[10px] uppercase">平仓收益率</span><span class="text-green-500 font-black">+8.42%</span></div>
                    <div class="flex justify-between"><span class="text-gray-400 text-[10px] uppercase">交易手续费</span><span class="text-gray-900 font-mono">-12.45 USDT</span></div>
                    <div class="flex justify-between"><span class="text-gray-400 text-[10px] uppercase">资金费率</span><span class="text-red-500 font-mono">-0.45 USDT</span></div>
                    <div class="flex justify-between"><span class="text-gray-400 text-[10px] uppercase">开仓时间</span><span class="text-gray-900">2026-06-11 18:59:05</span></div>
                    <div class="flex justify-between"><span class="text-gray-400 text-[10px] uppercase">平仓时间</span><span class="text-gray-900">2026-06-11 18:59:20</span></div>
                </div>
            </div>

            <div class="border-t-[8px] border-gray-50">
                <div class="px-5 pt-5 pb-2">
                    <h3 class="font-black text-[13px] text-gray-900">历史委托</h3>
                </div>
                <div id="related-order-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const COPY_SVG = `<svg class="copy-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>`;

    function infoRow(label, value, valueClass) {
        return `<div class="flex justify-between items-center text-[11px] font-bold gap-3"><span class="text-gray-400 text-[9px] uppercase shrink-0">${label}</span><span class="text-gray-900 text-right font-mono ${valueClass || ''}">${value}</span></div>`;
    }

    function dirBadge(dir, isOpen) {
        const cls = isOpen ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600';
        return `<span class="${cls} text-[10px] px-1 font-black rounded-sm">${dir}</span>`;
    }

    function relatedOrderCard(order) {
        return `
            <div class="order-card">
                <div class="flex justify-between items-center mb-3">
                    ${dirBadge(order.direction, order.isOpen)}
                    <span class="text-gray-300 font-medium text-[10px]">${order.time}</span>
                </div>
                <div class="space-y-2.5">
                    ${infoRow('成交数量', order.qty)}
                    ${infoRow('成交均价', order.avgPrice)}
                    ${infoRow('手续费', order.fee, order.fee.startsWith('-') ? 'text-red-500' : '')}
                    ${infoRow('已实现盈亏', order.pnl, order.pnl === '--' ? 'text-gray-400' : (order.pnl.startsWith('+') ? 'text-green-500' : 'text-red-500'))}
                    <div class="flex justify-between items-center text-[11px] font-bold">
                        <span class="text-gray-400 text-[9px] uppercase">订单编号</span>
                        <div class="flex items-center gap-1 font-mono text-gray-900">${order.orderId} ${COPY_SVG}</div>
                    </div>
                </div>
            </div>`;
    }

    const RELATED_ORDERS = [
        { direction: '开多', isOpen: true, time: '06/11 18:59:05', qty: '620.00 USDC', avgPrice: '592.15', fee: '-0.62 USDT', pnl: '--', orderId: 'OR-88291001' },
        { direction: '平多', isOpen: false, time: '06/11 18:59:20', qty: '620.00 USDC', avgPrice: '604.22', fee: '-0.62 USDT', pnl: '+12.30 USDC', orderId: 'OR-88291008' },
    ];

    document.getElementById('related-order-list').innerHTML = RELATED_ORDERS.map(relatedOrderCard).join('');
</script>

</body>
</html>
