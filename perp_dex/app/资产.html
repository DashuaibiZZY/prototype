<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP - 资产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #111827;
        }
        .phone-shell {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 50px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            position: relative;
            border: 4px solid #333;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 38px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .top-acct-tab {
            font-size: 16px;
            font-weight: 500;
            color: #8c929c;
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            line-height: 1.3;
            transition: color 0.15s ease;
        }
        .top-acct-tab.is-active {
            font-size: 17px;
            font-weight: 700;
            color: #111827;
        }
        .sub-tab-btn {
            position: relative;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            background: transparent;
            border: none;
            padding: 0 0 8px 0;
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .sub-tab-btn.is-active {
            font-weight: 600;
            color: #111827;
        }
        .sub-tab-btn.is-active::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: #111827;
            border-radius: 999px;
        }
        .balance-trial-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            padding: 2px 6px;
            border-radius: 6px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            font-size: 10px;
            font-weight: 700;
            color: #b45309;
            line-height: 1.25;
            max-width: 100%;
            white-space: normal;
            text-align: right;
        }
        .balance-trial-dot {
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: #f59e0b;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="phone-shell">
    <div class="screen">

        <!-- iOS 状态栏 -->
        <div class="px-6 pt-3.5 pb-1 flex items-center justify-between shrink-0 select-none">
            <div class="flex items-center gap-1 text-[13px] font-bold text-[#111827] tracking-tight">
                <span>20:13</span>
                <svg class="w-3 h-3 text-[#111827]" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path d="M10 9a3.2 3.2 0 100-6.4A3.2 3.2 0 0010 9zm-5.2 7.2a5.2 5.2 0 0110.4 0 .8.8 0 01-.8.8H5.6a.8.8 0 01-.8-.8z"/>
                </svg>
            </div>
            <div class="flex items-center gap-1.5 text-[#111827]">
                <!-- 双卡信号点条 -->
                <svg class="w-4 h-3" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true">
                    <rect x="0.5" y="7" width="2.4" height="4.5" rx="0.8"/>
                    <rect x="4.5" y="5" width="2.4" height="6.5" rx="0.8"/>
                    <rect x="8.5" y="3" width="2.4" height="8.5" rx="0.8"/>
                    <rect x="12.5" y="1" width="2.4" height="10.5" rx="0.8"/>
                </svg>
                <!-- Wi-Fi -->
                <svg class="w-3.5 h-3" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
                    <path d="M8 9.4a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zm-3.1-1.9a4.6 4.6 0 016.2 0l1.1-1.2a6.2 6.2 0 00-8.4 0l1.1 1.2zm-2.4-2.5a8 8 0 0111 0l1.1-1.2a9.6 9.6 0 00-13.2 0l1.1 1.2z"/>
                </svg>
                <!-- 电量 72 -->
                <div class="flex items-center">
                    <div class="relative w-[22px] h-[12px] rounded-[3.5px] bg-[#111827] flex items-center justify-center">
                        <span class="text-[8.5px] font-bold text-white leading-none tracking-tighter">72</span>
                    </div>
                    <div class="w-[1.5px] h-[4.5px] bg-[#9ca3af] rounded-r-sm ml-[1px]"></div>
                </div>
            </div>
        </div>

        <!-- 顶部账户 Tab 导航 + 右侧历史图标 -->
        <header class="px-4 pt-3 pb-2.5 flex items-center justify-between shrink-0 bg-white">
            <div class="flex items-baseline gap-4" role="tablist">
                <button type="button" class="top-acct-tab" data-acct-tab="overview">总览</button>
                <button type="button" class="top-acct-tab" data-acct-tab="funding">资金账户</button>
                <button type="button" class="top-acct-tab is-active" data-acct-tab="perp">合约账户</button>
            </div>
            <a href="交易流水頁面.html" class="p-1 -mr-1 text-[#111827] hover:opacity-70 transition-opacity" aria-label="交易记录">
                <svg class="w-[19px] h-[19px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h4"/>
                    <path d="M14 3l5 5v3"/>
                    <path d="M14 3v5h5"/>
                    <circle cx="16.5" cy="16.5" r="4"/>
                    <path d="M16.5 14.7v1.8l1.2.8"/>
                </svg>
            </a>
        </header>

        <!-- 主内容区 -->
        <main class="flex-1 flex flex-col overflow-y-auto no-scrollbar pb-[68px]">

            <!-- 账户权益 + 迷你紫线 -->
            <section class="px-4 pt-2.5">
                <div class="flex items-center gap-1.5">
                    <span class="text-[12px] text-[#8c929c] font-normal" id="hero-equity-label">账户权益</span>
                    <button type="button" onclick="toggleEye()" class="text-[#8c929c] hover:text-[#4b5563] p-0.5 leading-none" aria-label="隐藏或显示资产">
                        <svg id="eye-icon" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <div class="mt-1.5 flex items-center justify-between gap-3">
                    <div class="flex items-baseline">
                        <span class="text-[31px] leading-none font-bold text-[#111827] tracking-tight tabular-nums" data-mask-val="0.00">0.00</span>
                        <button type="button" onclick="showToast('当前计价单位：USDC')" class="inline-flex items-center ml-1.5 text-[13px] font-medium text-[#111827] leading-none">
                            <span>USDC</span>
                            <svg class="w-2.5 h-2.5 ml-1 text-[#111827]" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
                                <path d="M2.5 4.2h7L6 8.2 2.5 4.2z"/>
                            </svg>
                        </button>
                    </div>
                    <!-- 右侧趋势参考紫线 -->
                    <svg class="w-[128px] h-[22px] shrink-0" viewBox="0 0 128 22" fill="none" aria-hidden="true">
                        <line x1="0" y1="14" x2="128" y2="14" stroke="#a64ac9" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>

                <a href="交易流水頁面.html" class="mt-2 inline-flex items-center gap-1 text-[12px] leading-snug">
                    <span class="text-[#8c929c]">今日已实现盈亏</span>
                    <span class="text-[#4b5563] font-medium tabular-nums" data-mask-val="0.00">0.00</span>
                    <svg class="w-3 h-3 text-[#4b5563]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 6l6 6-6 6"/>
                    </svg>
                </a>
            </section>

            <!-- 2 列保证金 & 未实现盈亏 -->
            <section class="px-4 mt-5 grid grid-cols-2 gap-4">
                <div>
                    <p class="text-[11px] text-[#8c929c] leading-tight">可用保证金 USDC</p>
                    <p class="mt-1.5 text-[14px] font-semibold text-[#111827] tabular-nums" data-mask-val="0.00">0.00</p>
                </div>
                <div>
                    <p class="text-[11px] text-[#8c929c] leading-tight">未实现盈亏 USDC</p>
                    <p class="mt-1.5 text-[14px] font-semibold text-[#18b888] tabular-nums" data-mask-val="0.00">0.00</p>
                </div>
            </section>

            <!-- 3 个胶囊操作按钮 -->
            <section class="px-4 mt-5 grid grid-cols-3 gap-2.5">
                <a href="充值.html" class="h-[34px] rounded-full bg-[#090a0c] text-white text-[13px] font-medium flex items-center justify-center active:opacity-85 transition-opacity">
                    充值
                </a>
                <button type="button" onclick="showToast('划转功能原型')" class="h-[34px] rounded-full bg-[#eaedf2] text-[#111827] text-[13px] font-medium flex items-center justify-center active:bg-[#dfe4ec] transition-colors">
                    划转
                </button>
                <a href="交易流水頁面.html" class="h-[34px] rounded-full bg-[#eaedf2] text-[#111827] text-[13px] font-medium flex items-center justify-center active:bg-[#dfe4ec] transition-colors">
                    交易历史
                </a>
            </section>

            <!-- 子 Tab：资产列表 / 持仓敞口 / 体验金 -->
            <section class="px-4 mt-6 flex items-center gap-6 border-b border-[#f3f4f6]" role="tablist">
                <button type="button" class="sub-tab-btn is-active" data-sub-tab="assets">资产列表</button>
                <button type="button" class="sub-tab-btn" data-sub-tab="exposure">持仓敞口</button>
                <button type="button" class="sub-tab-btn" data-sub-tab="trial">体验金</button>
            </section>

            <!-- 资产列表（卡片式：仅币种简称 + 逐行指标，避免大三列挤版） -->
            <section class="px-4 pt-3.5 pb-6 space-y-2.5" data-sub-panel="assets">
                <div class="rounded-xl border border-[#f0f2f5] bg-[#fafbfc] px-3.5 py-3">
                    <div class="flex items-center gap-2.5">
                        <span class="w-6 h-6 rounded-full bg-blue-600 text-white text-[9px] font-bold flex items-center justify-center shrink-0">US</span>
                        <span class="text-[14px] font-bold text-[#111827] leading-none">USDC</span>
                    </div>
                    <dl class="mt-3 pt-2.5 border-t border-[#eef0f3] space-y-2.5">
                        <div class="flex items-start justify-between gap-3">
                            <dt class="text-[11px] text-[#8c929c] leading-tight shrink-0 pt-0.5">余额</dt>
                            <dd class="text-right min-w-0 flex-1">
                                <div class="text-[13px] font-semibold text-[#111827] tabular-nums break-all leading-snug" data-mask-val="101,151.49">101,151.49</div>
                                <span class="balance-trial-tag justify-end" title="余额中含体验金，固定 USDC 计价">
                                    <span class="balance-trial-dot" aria-hidden="true"></span>
                                    <span data-mask-val="含体验金 1,250.00">含体验金 1,250.00</span>
                                </span>
                            </dd>
                        </div>
                        <div class="flex items-start justify-between gap-3">
                            <dt class="text-[11px] text-[#8c929c] leading-tight shrink-0 pt-0.5">未实现盈亏</dt>
                            <dd class="text-[13px] font-semibold text-[#18b888] tabular-nums text-right break-all leading-snug min-w-0" data-mask-val="0.00">0.00</dd>
                        </div>
                        <div class="flex items-start justify-between gap-3">
                            <dt class="text-[11px] text-[#8c929c] leading-tight shrink-0 pt-0.5">权益</dt>
                            <dd class="text-[13px] font-bold text-[#111827] tabular-nums text-right break-all leading-snug min-w-0" data-mask-val="101,151.49">101,151.49</dd>
                        </div>
                    </dl>
                </div>

                <div class="rounded-xl border border-[#f0f2f5] bg-[#fafbfc] px-3.5 py-3">
                    <div class="flex items-center gap-2.5">
                        <span class="w-6 h-6 rounded-full bg-amber-600 text-white text-[9px] font-bold flex items-center justify-center shrink-0">US</span>
                        <span class="text-[14px] font-bold text-[#111827] leading-none">USD1</span>
                    </div>
                    <dl class="mt-3 pt-2.5 border-t border-[#eef0f3] space-y-2.5">
                        <div class="flex items-start justify-between gap-3">
                            <dt class="text-[11px] text-[#8c929c] leading-tight shrink-0 pt-0.5">余额</dt>
                            <dd class="text-[13px] font-semibold text-[#111827] tabular-nums text-right break-all leading-snug min-w-0" data-mask-val="0.00">0.00</dd>
                        </div>
                        <div class="flex items-start justify-between gap-3">
                            <dt class="text-[11px] text-[#8c929c] leading-tight shrink-0 pt-0.5">未实现盈亏</dt>
                            <dd class="text-[13px] font-semibold text-[#18b888] tabular-nums text-right break-all leading-snug min-w-0" data-mask-val="0.00">0.00</dd>
                        </div>
                        <div class="flex items-start justify-between gap-3">
                            <dt class="text-[11px] text-[#8c929c] leading-tight shrink-0 pt-0.5">权益</dt>
                            <dd class="text-[13px] font-bold text-[#111827] tabular-nums text-right break-all leading-snug min-w-0" data-mask-val="0.00">0.00</dd>
                        </div>
                    </dl>
                </div>
            </section>

            <!-- 持仓敞口 / 体验金 空状态 -->
            <section class="hidden flex-1 flex flex-col items-center justify-center px-6 pb-20" data-sub-panel="empty">
                <svg class="w-12 h-12" viewBox="0 0 56 56" fill="none" aria-hidden="true">
                    <!-- 浅灰文档底板 -->
                    <rect x="16" y="8" width="28" height="36" rx="3" fill="#f3f4f6"/>
                    <rect x="21" y="15" width="16" height="2.4" rx="1.2" fill="#d1d5db"/>
                    <rect x="21" y="21" width="18" height="2.4" rx="1.2" fill="#d1d5db"/>
                    <rect x="21" y="27" width="12" height="2.4" rx="1.2" fill="#d1d5db"/>
                    <!-- 左下放大镜 -->
                    <circle cx="22.5" cy="34.5" r="7.5" fill="#ffffff" stroke="#9ca3af" stroke-width="2.2"/>
                    <line x1="17" y1="40" x2="11.5" y2="45.5" stroke="#9ca3af" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
                <p class="mt-2.5 text-[13px] text-[#9ca3af] font-normal">暂无记录</p>
            </section>

        </main>

        <!-- 底部 4-Tab 导航栏（首页 / 行情 / 永续合约 / 资产） -->
        <nav class="absolute bottom-0 inset-x-0 bg-white border-t border-[#f3f4f6] px-2 pt-2 pb-5 grid grid-cols-4 items-center shrink-0 z-10">
            <a href="首页.html" class="flex flex-col items-center justify-center gap-1 text-[#8c929c]">
                <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M5.5 9.2c1.8-1.8 4.4-2.2 6.5-.8 2.1 1.4 4.7 1 6.5-.8l1 1.4c-2.2 2.2-5.4 2.7-8 1-1.6-1-3.6-.7-5 .7l-1-1.5z"/>
                    <path d="M5.5 14.4c1.8-1.8 4.4-2.2 6.5-.8 2.1 1.4 4.7 1 6.5-.8l1 1.4c-2.2 2.2-5.4 2.7-8 1-1.6-1-3.6-.7-5 .7l-1-1.5z"/>
                </svg>
                <span class="text-[10px] font-normal leading-none">首页</span>
            </a>
            <a href="行情.html" class="flex flex-col items-center justify-center gap-1 text-[#8c929c]">
                <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="6" width="16" height="12" rx="2"/>
                    <path d="M9 3h6"/>
                    <path d="M7.5 13.5l2.5-2.5 2.2 2 3.8-4"/>
                </svg>
                <span class="text-[10px] font-normal leading-none">行情</span>
            </a>
            <a href="合约交易.html" class="flex flex-col items-center justify-center gap-1 text-[#8c929c]">
                <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="4" width="14" height="16" rx="2"/>
                    <path d="M8.5 9h7M8.5 12.5h7M8.5 16h4.5"/>
                </svg>
                <span class="text-[10px] font-normal leading-none">永续合约</span>
            </a>
            <a href="资产.html" class="flex flex-col items-center justify-center gap-1 text-[#111827]">
                <svg class="w-[22px] h-[22px] text-[#c03ee8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 8.5A2.5 2.5 0 016.5 6h11A2.5 2.5 0 0120 8.5v8a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 16.5v-8z"/>
                    <path d="M6 6l8.5-2.2A1.5 1.5 0 0116.4 5.2V6"/>
                    <path d="M15 11.5h5v3h-5a1.5 1.5 0 010-3z"/>
                </svg>
                <span class="text-[10px] font-semibold leading-none text-[#111827]">资产</span>
            </a>
        </nav>

    </div>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-semibold px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity z-50"></div>

<script>
let isMasked = false;

function toggleEye() {
    isMasked = !isMasked;
    const eye = document.getElementById('eye-icon');
    document.querySelectorAll('[data-mask-val]').forEach(el => {
        el.textContent = isMasked ? '****' : el.dataset.maskVal;
    });
    eye.innerHTML = isMasked
        ? '<path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.77 21.77 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 5c7 0 11 7 11 7a21.8 21.8 0 01-2.16 3.19M1 1l22 22"/>'
        : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>';
}

document.querySelectorAll('[data-acct-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('[data-acct-tab]').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
    });
});

document.querySelectorAll('[data-sub-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
        const target = btn.dataset.subTab;
        document.querySelectorAll('[data-sub-tab]').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        const isAssets = target === 'assets';
        document.querySelector('[data-sub-panel="assets"]').classList.toggle('hidden', !isAssets);
        document.querySelector('[data-sub-panel="empty"]').classList.toggle('hidden', isAssets);
    });
});

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.add('opacity-0'), 1800);
}
</script>
</body>
</html>
