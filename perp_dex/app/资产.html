<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP - 资产</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .phone-shell { width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; border: 4px solid #333; }
        .screen { width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .asset-card { background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 16px; padding: 16px; }
        .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .quick-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 12px; background: #fff; border: 1px solid #f3f4f6; text-decoration: none; color: #111827; font-size: 10px; font-weight: 800; }
        .quick-btn:active { background: #f3f4f6; }
        .account-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid #f3f4f6; text-decoration: none; color: inherit; }
        .account-row:active { background: #f9fafb; }
    </style>
</head>
<body>

<div class="phone-shell">
    <div class="screen flex flex-col bg-slate-50">

        <header class="flex justify-between items-center px-5 pt-12 pb-3 shrink-0 bg-white border-b border-gray-50">
            <a href="个人中心.html" class="p-1 -ml-1" aria-label="个人中心">
                <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </a>
            <h1 class="font-black text-[15px] tracking-tight">资产</h1>
            <a href="交易流水頁面.html" class="p-1 text-gray-500" aria-label="流水">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            </a>
        </header>

        <div class="flex-1 overflow-y-auto no-scrollbar px-4 pt-4 pb-24 space-y-4">

            <!-- 总资产 -->
            <section class="asset-card">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">总资产估值 (USDT)</span>
                    <button onclick="toggleEye()" class="text-gray-400 focus:outline-none" aria-label="隐藏资产">
                        <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
                <p id="total-asset" class="text-[28px] font-black text-gray-900 tracking-tight leading-tight">12,450.82</p>
                <p id="pnl-line" class="text-[11px] font-bold text-green-500 mt-1">今日盈亏 +$420.15 (+3.42%)</p>

                <div class="quick-grid mt-4">
                    <a href="充值.html" class="quick-btn">
                        <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        充值
                    </a>
                    <a href="提现.html" class="quick-btn">
                        <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
                        提现
                    </a>
                    <a href="#" class="quick-btn" onclick="showToast('划转功能原型'); return false;">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                        划转
                    </a>
                </div>
            </section>

            <!-- 多账户 -->
            <section>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 px-1">账户资产</p>
                <div class="space-y-2">
                    <a href="交易流水頁面.html" class="account-row">
                        <div>
                            <p class="text-[13px] font-black text-gray-900">资金账户</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">充值 / 提现 / 划转</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[14px] font-black text-gray-900" data-asset>3,240.50</p>
                            <p class="text-[9px] text-gray-400 font-bold">USDT</p>
                        </div>
                    </a>
                    <a href="合约交易.html" class="account-row">
                        <div>
                            <p class="text-[13px] font-black text-gray-900">合约账户</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">永续合约保证金</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[14px] font-black text-gray-900" data-asset>9,210.32</p>
                            <p class="text-[9px] text-gray-400 font-bold">USDT</p>
                        </div>
                    </a>
                </div>
            </section>

            <!-- 权益入口 -->
            <section>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 px-1">权益快捷入口</p>
                <div class="grid grid-cols-2 gap-2">
                    <a href="积分.html" class="account-row !py-3">
                        <span class="text-[12px] font-black text-gray-900">积分</span>
                        <span class="text-[12px] font-black text-blue-600">234,124</span>
                    </a>
                    <a href="卡券中心.html" class="account-row !py-3">
                        <span class="text-[12px] font-black text-gray-900">我的卡券</span>
                        <span class="text-[12px] font-black text-emerald-600">2 张</span>
                    </a>
                </div>
            </section>
        </div>

        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 px-4 pt-2 pb-8 flex justify-between items-center shrink-0 z-10">
            <a href="首页.html"><div class="flex flex-col items-center space-y-1 px-3 text-gray-400"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="text-[10px]">首頁</span></div></a>
            <a href="行情.html"><div class="flex flex-col items-center space-y-1 px-3 text-gray-400"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"/></svg><span class="text-[10px]">行情</span></div></a>
            <a href="合约交易.html"><div class="flex flex-col items-center space-y-1 px-3 text-gray-400"><div class="bg-black rounded-lg p-1.5 -mt-6 shadow-lg shadow-black/20"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg></div><span class="text-[10px] pt-1">永續合約</span></div></a>
            <a href="奖励.html"><div class="flex flex-col items-center space-y-1 px-3 text-gray-400"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12z"/></svg><span class="text-[10px]">獎勵</span></div></a>
            <a href="资产.html"><div class="flex flex-col items-center space-y-1 px-3"><svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg><span class="text-[10px] font-bold text-black">资产</span></div></a>
        </nav>
    </div>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity z-50"></div>

<script>
const realTotal = '12,450.82';
const realPnl = '今日盈亏 +$420.15 (+3.42%)';
let hidden = false;

function toggleEye() {
    hidden = !hidden;
    const total = document.getElementById('total-asset');
    const pnl = document.getElementById('pnl-line');
    const eye = document.getElementById('eye-icon');
    document.querySelectorAll('[data-asset]').forEach(el => {
        el.textContent = hidden ? '****' : el.dataset.val || el.textContent;
    });
    if (hidden) {
        document.querySelectorAll('[data-asset]').forEach(el => { if (!el.dataset.val) el.dataset.val = el.textContent; el.textContent = '****'; });
        total.textContent = '******';
        pnl.textContent = '今日盈亏 ****';
        eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>';
    } else {
        document.querySelectorAll('[data-asset]').forEach(el => { el.textContent = el.dataset.val || el.textContent; });
        total.textContent = realTotal;
        pnl.textContent = realPnl;
        eye.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
    }
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0');
    setTimeout(() => t.classList.add('opacity-0'), 1800);
}
</script>
</body>
</html>
