<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP · 合伙人管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .phone-shell { width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; border: 4px solid #333; }
        .screen { width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .seg-tab { flex: 1; text-align: center; padding: 8px 4px; font-size: 11px; font-weight: 800; color: #9ca3af; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
        .seg-tab.active { color: #000; border-color: #000; font-weight: 900; }

        .header-text-btn { font-size: 11px; font-weight: 800; color: #2563eb; padding: 4px 2px; white-space: nowrap; }
        .header-icon-btn { width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #374151; }
        .header-icon-btn:active { background: #f3f4f6; }
        .inline-action-btn { width: 100%; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; color: #2563eb; background: #eff6ff; border: 1px dashed #bfdbfe; }
        .inline-action-btn:active { background: #dbeafe; }
        .period-option { width: 100%; padding: 12px 14px; text-align: left; font-size: 12px; font-weight: 800; color: #6b7280; border-radius: 12px; border: 1px solid transparent; }
        .period-option.active { color: #000; background: #f9fafb; border-color: #000; }
        .period-option + .period-option { margin-top: 6px; }

        .summary-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #f1f5f9; border-radius: 12px; padding: 10px 14px; font-size: 11px; font-weight: 800; color: #374151; }
        .summary-bar span:last-child { color: #2563eb; }

        .commission-kpi-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: #fff; border: 1px solid #f1f5f9; border-radius: 14px; overflow: hidden; }
        .commission-kpi-strip > div { padding: 12px 6px; text-align: center; border-right: 1px solid #f3f4f6; min-width: 0; }
        .commission-kpi-strip > div:last-child { border-right: none; }
        .commission-kpi-strip .ck-label { font-size: 9px; font-weight: 700; color: #9ca3af; white-space: nowrap; }
        .commission-kpi-strip .ck-value { font-size: 12px; font-weight: 900; margin-top: 4px; line-height: 1.15; word-break: break-all; }
        .commission-kpi-strip .ck-sub { font-size: 8px; color: #9ca3af; margin-top: 2px; font-weight: 700; }

        .compact-kpi-panel { background: #fff; border: 1px solid #f1f5f9; border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 12px; }
        .compact-kpi-panel .ck-item .ck-label { font-size: 9px; font-weight: 700; color: #9ca3af; }
        .compact-kpi-panel .ck-item .ck-value { font-size: 14px; font-weight: 900; margin-top: 3px; line-height: 1.2; }
        .compact-kpi-panel .ck-item.span-2 { grid-column: span 2; padding-top: 4px; border-top: 1px solid #f9fafb; }

        .list-card { background: #fff; border: 1px solid #f1f5f9; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
        .list-card:active { background: #fafafa; }
        .status-badge { font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
        .status-badge.on { color: #16a34a; background: #dcfce7; }
        .status-badge.off { color: #9ca3af; background: #f3f4f6; }
        .icon-btn { width: 32px; height: 32px; border-radius: 10px; background: #f3f4f6; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .icon-btn:active { background: #e5e7eb; }
        .action-btn { padding: 6px 12px; border-radius: 10px; font-size: 10px; font-weight: 800; background: #f3f4f6; color: #374151; border: none; }
        .action-btn.danger { color: #dc2626; background: #fef2f2; }
        .action-btn.primary { color: #2563eb; background: #eff6ff; }
        .metric-cell { min-width: 0; }
        .metric-cell .metric-label { color: #9ca3af; font-weight: 700; font-size: 9px; line-height: 1.2; margin-bottom: 2px; }
        .metric-cell .metric-value { color: #111827; font-weight: 900; font-size: 11px; line-height: 1.25; word-break: break-all; }
        .metric-grid { display: grid; gap: 8px 10px; }
        .card-actions { display: grid; gap: 8px; width: 100%; }
        .card-actions.cols-1 { grid-template-columns: minmax(0, 1fr); }
        .card-actions.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .card-actions.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .card-actions .action-btn { width: 100%; text-align: center; padding: 10px 6px; }
        .card-actions .action-btn-static { width: 100%; text-align: center; padding: 10px 6px; border-radius: 10px; font-size: 10px; font-weight: 800; background: #f3f4f6; color: #9ca3af; }

        .sub-tab { font-size: 12px; font-weight: 700; color: #9ca3af; padding-bottom: 6px; border-bottom: 2px solid transparent; }
        .sub-tab.active { color: #000; border-color: #000; font-weight: 900; }

        .hint-dashed { border-bottom: 1px dashed currentColor; cursor: pointer; }

        .uid-copy { display: inline-flex; align-items: center; gap: 4px; }
        .uid-copy-btn { color: #9ca3af; padding: 2px; line-height: 0; border-radius: 4px; }
        .uid-copy-btn:active { color: #2563eb; background: #eff6ff; }

        .list-end-hint { text-align: center; padding: 16px 12px 24px; font-size: 10px; font-weight: 600; color: #9ca3af; line-height: 1.5; }

        .stack-page { position: absolute; inset: 0; background: #fff; z-index: 50; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.25s ease; }
        .stack-page.active { transform: translateX(0); }

        .bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 20px 20px 0 0; z-index: 110; transform: translateY(100%); transition: transform 0.28s ease; max-height: 85%; display: flex; flex-direction: column; }
        .bottom-sheet.active { transform: translateY(0); }
        .sheet-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; opacity: 0; visibility: hidden; transition: opacity 0.2s; }
        .sheet-overlay.active { opacity: 1; visibility: visible; }

        .app-dialog { position: absolute; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,0.5); }
        .app-dialog.active { display: flex; }
        .app-dialog-card { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 300px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .app-dialog-title { font-size: 14px; font-weight: 900; color: #111827; margin-bottom: 8px; }
        .app-dialog-body { font-size: 12px; color: #6b7280; line-height: 1.55; font-weight: 500; }
        .app-dialog-actions { display: flex; gap: 8px; margin-top: 16px; }
        .app-dialog-actions button { flex: 1; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; }
        .app-dialog-cancel { background: #f3f4f6; color: #6b7280; }
        .app-dialog-confirm { background: #000; color: #fff; }

        .share-overlay { position: absolute; inset: 0; z-index: 130; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; border-radius: 38px; }
        .share-overlay.active { display: flex; }

        .ratio-control { display: flex; align-items: center; gap: 10px; }
        .ratio-control input[type=number] { width: 64px; text-align: center; font-weight: 900; font-size: 14px; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px 4px; }
        .ratio-control input[type=range] { flex: 1; accent-color: #000; }
        .ratio-max-label { text-align: center; font-size: 11px; font-weight: 800; color: #9ca3af; margin-top: 6px; }

        .app-toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(12px); background: rgba(17,24,39,0.92); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 11px; font-weight: 700; z-index: 140; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
        .app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .filter-chip { padding: 6px 12px; border-radius: 999px; font-size: 10px; font-weight: 800; color: #6b7280; background: #f3f4f6; border: 1px solid transparent; }
        .filter-chip.active { color: #000; background: #fff; border-color: #000; }
        .analytics-chart-wrap { width: 100%; }
        .analytics-chart-shell { display: flex; align-items: stretch; gap: 6px; height: 140px; width: 100%; }
        .analytics-chart-y-axis { width: 36px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 0 18px; text-align: right; font-size: 8px; font-weight: 700; color: #94a3b8; line-height: 1; font-variant-numeric: tabular-nums; }
        .analytics-chart-shell svg { flex: 1; min-width: 0; height: 100%; display: block; }
        .analytics-source-legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 10px; font-size: 9px; font-weight: 800; color: #9ca3af; }
        .analytics-source-legend span { display: inline-flex; align-items: center; gap: 4px; }
        .analytics-source-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
        .section-card { border: 1px solid #f1f5f9; border-radius: 14px; padding: 14px; background: #fff; margin-bottom: 12px; }
        .dim-tab { padding: 6px 12px; border-radius: 999px; font-size: 10px; font-weight: 800; color: #6b7280; background: #f3f4f6; white-space: nowrap; }
        .dim-tab.active { background: #000; color: #fff; }
    </style>
</head>
<body>

<div class="phone-shell">
    <div class="screen">

        <div class="px-6 pt-4 pb-1 flex justify-between items-center text-[11px] font-bold text-gray-900 shrink-0">
            <span>18:58</span>
            <div class="w-5 h-2.5 border border-black rounded-sm relative"><div class="absolute inset-0.5 bg-black w-3"></div></div>
        </div>

        <header class="flex items-center px-3 h-11 shrink-0 border-b border-gray-50">
            <button type="button" id="app-header-back" class="p-2 -ml-1" onclick="PartnerCenterApp.goBack()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 id="app-header-title" class="flex-1 text-center text-[15px] font-black truncate px-2">合伙人中心</h1>
            <div id="app-header-action" class="min-w-[52px] flex justify-end shrink-0"></div>
        </header>

        <nav id="main-tabs" class="flex border-b border-gray-100 shrink-0 bg-white">
            <button type="button" class="seg-tab active" data-tab="links" onclick="PartnerCenterApp.switchTab('links')">邀请链接</button>
            <button type="button" class="seg-tab" data-tab="team" onclick="PartnerCenterApp.switchTab('team')">团队</button>
            <button type="button" class="seg-tab" data-tab="analytics" onclick="PartnerCenterApp.switchTab('analytics')">数据</button>
            <button type="button" class="seg-tab" data-tab="commission" onclick="PartnerCenterApp.switchTab('commission')">佣金</button>
        </nav>

        <div id="hub-scroll" class="flex-1 overflow-y-auto no-scrollbar bg-slate-50/80">

            <div id="view-links" class="view-panel px-4 py-3">
                <div id="links-summary" class="mb-3"></div>
                <div class="mb-3">
                    <input type="search" id="links-search-input" placeholder="搜索备注或邀请码" class="w-full text-[11px] font-medium border border-gray-200 rounded-xl px-3 py-2 outline-none focus:border-black bg-white" oninput="PartnerCenterApp.setLinksSearch(this.value)">
                </div>
                <div class="mb-3">
                    <button type="button" class="inline-action-btn" onclick="PartnerCenterApp.openCreateLink()">+ 新增邀请链接</button>
                </div>
                <div id="links-list"></div>
                <div id="links-list-end"></div>
            </div>

            <div id="view-team" class="view-panel px-4 py-3 hidden">
                <div id="team-identity" class="list-card mb-3"></div>
                <div id="team-kpi-grid" class="mb-3"></div>
                <div id="team-subtabs" class="flex gap-5 mb-3 border-b border-gray-100 pb-1"></div>
                <div class="mb-3">
                    <input type="search" id="team-search-input" placeholder="搜索 UID / 钱包" class="w-full text-[11px] font-medium border border-gray-200 rounded-xl px-3 py-2 outline-none bg-white" oninput="PartnerCenterApp.setTeamSearch(this.value)">
                </div>
                <div id="team-toolbar" class="mb-3 hidden"></div>
                <div id="team-list"></div>
                <div id="team-list-end"></div>
            </div>

            <div id="view-analytics" class="view-panel px-4 py-3 hidden">
                <div id="analytics-kpi-grid" class="mb-3"></div>
                <div id="analytics-dim-tabs" class="flex gap-2 mb-2 overflow-x-auto no-scrollbar"></div>
                <p id="analytics-dim-hint" class="text-[10px] text-gray-500 font-medium mb-3 hidden leading-relaxed"></p>
                <div id="analytics-sections"></div>
            </div>

            <div id="view-commission" class="view-panel px-4 py-3 hidden">
                <div id="commission-kpi-row" class="mb-3"></div>
                <div id="commission-list"></div>
                <div id="commission-list-end"></div>
            </div>
        </div>

        <div id="stack-commission-detail" class="stack-page">
            <header class="flex items-center px-3 h-11 shrink-0 border-b border-gray-50 bg-white">
                <button type="button" class="p-2" onclick="PartnerCenterApp.closeCommissionDetail()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <div class="flex-1 text-center">
                    <p class="text-[15px] font-black">佣金详情</p>
                    <p id="cd-subtitle" class="text-[10px] text-gray-400 font-medium"></p>
                </div>
                <div class="w-9"></div>
            </header>
            <div id="cd-scroll" class="flex-1 overflow-y-auto no-scrollbar px-4 py-3 bg-slate-50/80">
                <div id="cd-kpi-grid" class="mb-3"></div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2">当日返佣贡献</p>
                <div id="cd-list"></div>
                <div id="cd-list-end"></div>
            </div>
        </div>

        <div id="stack-commission-trades" class="stack-page">
            <header class="flex items-center px-3 h-11 shrink-0 border-b border-gray-50 bg-white">
                <button type="button" class="p-2" onclick="PartnerCenterApp.closeCommissionTrades()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <div class="flex-1 text-center min-w-0 px-1">
                    <p class="text-[15px] font-black">交易返佣流水</p>
                    <p id="ct-subtitle" class="text-[10px] text-gray-400 font-medium truncate"></p>
                </div>
                <div class="w-9"></div>
            </header>
            <div id="ct-scroll" class="flex-1 overflow-y-auto no-scrollbar px-4 py-3 bg-slate-50/80">
                <div id="ct-list"></div>
                <div id="ct-list-end"></div>
            </div>
        </div>

        <div id="stack-drill" class="stack-page">
            <header class="flex items-center px-3 h-11 shrink-0 border-b border-gray-50 bg-white">
                <button type="button" class="p-2" onclick="PartnerCenterApp.drillBack()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <div class="flex-1 text-center">
                    <p class="text-[15px] font-black">团队穿透</p>
                    <p id="drill-breadcrumb" class="text-[10px] text-gray-400 font-medium truncate px-2"></p>
                </div>
                <div class="w-9"></div>
            </header>
            <div id="drill-scroll" class="flex-1 overflow-y-auto no-scrollbar px-4 py-3 bg-slate-50/80">
                <div id="drill-identity" class="list-card mb-3"></div>
                <div id="drill-kpi" class="mb-3"></div>
                <div id="drill-subtabs" class="flex gap-5 mb-3 border-b border-gray-100 pb-1"></div>
                <div id="drill-list"></div>
                <div id="drill-list-end"></div>
            </div>
        </div>

        <div id="sheet-overlay" class="sheet-overlay" onclick="PartnerCenterApp.closeAllSheets()"></div>

        <div id="sheet-period" class="bottom-sheet">
            <div class="p-4 border-b border-gray-100 shrink-0 flex justify-between items-center">
                <span class="font-black text-sm">选择数据周期</span>
                <button type="button" class="text-gray-400 font-bold text-xs" onclick="PartnerCenterApp.closeAllSheets()">关闭</button>
            </div>
            <div id="sheet-period-body" class="p-4"></div>
        </div>

        <div id="sheet-filter" class="bottom-sheet">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center shrink-0">
                <span class="font-black text-sm">筛选</span>
                <button type="button" class="text-gray-400 font-bold text-xs" onclick="PartnerCenterApp.closeAllSheets()">关闭</button>
            </div>
            <div id="sheet-filter-body" class="p-4 overflow-y-auto"></div>
        </div>

        <div id="sheet-create-link" class="bottom-sheet">
            <div class="p-4 border-b border-gray-100 shrink-0"><span class="font-black text-sm">创建邀请链接</span></div>
            <div class="p-4 space-y-3 overflow-y-auto">
                <div><label class="text-[10px] font-bold text-gray-400">备注名称</label><input id="create-link-remark" class="w-full border rounded-xl px-3 py-2 mt-1 text-[12px]" placeholder="例如：推特推广"></div>
                <div><label class="text-[10px] font-bold text-gray-400">邀请码（7位）</label><input id="create-link-code" maxlength="7" class="w-full border rounded-xl px-3 py-2 mt-1 text-[12px] font-mono uppercase" placeholder="ABC1234"></div>
                <button type="button" class="w-full bg-black text-white py-3 rounded-xl font-black text-[12px]" onclick="PartnerCenterApp.submitCreateLink()">确认创建</button>
            </div>
        </div>

        <div id="sheet-edit-link" class="bottom-sheet">
            <div class="p-4 border-b border-gray-100 shrink-0"><span class="font-black text-sm">修改备注</span></div>
            <div class="p-4 space-y-3">
                <input id="edit-link-remark" class="w-full border rounded-xl px-3 py-2 text-[12px]" placeholder="备注名称">
                <button type="button" class="w-full bg-black text-white py-3 rounded-xl font-black text-[12px]" onclick="PartnerCenterApp.submitEditLinkRemark()">保存</button>
            </div>
        </div>

        <div id="sheet-add-partner" class="bottom-sheet">
            <div class="p-4 border-b border-gray-100 shrink-0"><span class="font-black text-sm">添加下级合伙人</span></div>
            <div class="p-4 space-y-4 overflow-y-auto">
                <div><label class="text-[10px] font-bold text-gray-400">用户 UID</label><input id="add-partner-uid" class="w-full border rounded-xl px-3 py-2 mt-1 text-[12px]" placeholder="10086000"></div>
                <div><label class="text-[10px] font-bold text-gray-400">合伙人备注</label><input id="add-partner-remark" class="w-full border rounded-xl px-3 py-2 mt-1 text-[12px]" placeholder="例如：渠道-小王"></div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400">返佣比例</label>
                    <div class="ratio-control mt-2">
                        <input id="add-partner-ratio-input" type="number" min="0" max="70" value="50" oninput="PartnerCenterApp.syncAddPartnerRatio(this.value)">
                        <span class="text-sm font-bold text-gray-400">%</span>
                        <input id="add-partner-ratio-slider" type="range" min="0" max="70" value="50" oninput="PartnerCenterApp.syncAddPartnerRatio(this.value)">
                    </div>
                    <p id="add-partner-ratio-max" class="ratio-max-label">最高 70%</p>
                </div>
                <button type="button" class="w-full bg-black text-white py-3 rounded-xl font-black text-[12px]" onclick="PartnerCenterApp.submitAddPartner()">确认绑定</button>
            </div>
        </div>

        <div id="sheet-adjust-ratio" class="bottom-sheet">
            <div class="p-4 border-b border-gray-100 shrink-0"><span class="font-black text-sm">调整返佣比例</span></div>
            <div class="p-4 space-y-4 overflow-y-auto">
                <p id="adjust-ratio-target" class="text-[11px] font-bold text-gray-600"></p>
                <div>
                    <label class="text-[10px] font-bold text-gray-400">返佣比例</label>
                    <div class="ratio-control mt-2">
                        <input id="adjust-ratio-input" type="number" min="0" max="70" value="50" oninput="PartnerCenterApp.syncAdjustRatio(this.value)">
                        <span class="text-sm font-bold text-gray-400">%</span>
                        <input id="adjust-ratio-slider" type="range" min="0" max="70" value="50" oninput="PartnerCenterApp.syncAdjustRatio(this.value)">
                    </div>
                    <p id="adjust-ratio-max" class="ratio-max-label">最高 70%</p>
                </div>
                <button type="button" class="w-full bg-black text-white py-3 rounded-xl font-black text-[12px]" onclick="PartnerCenterApp.submitAdjustRatio()">确认调整</button>
            </div>
        </div>

        <div id="app-dialog" class="app-dialog" onclick="PartnerCenterApp.closeDialogOnOverlay(event)">
            <div class="app-dialog-card" onclick="event.stopPropagation()">
                <p id="app-dialog-title" class="app-dialog-title"></p>
                <p id="app-dialog-body" class="app-dialog-body"></p>
                <div id="app-dialog-actions" class="app-dialog-actions"></div>
            </div>
        </div>

        <div id="share-overlay" class="share-overlay" onclick="PartnerCenterApp.closeShareOverlay(event)">
            <div id="share-overlay-inner" class="w-full max-w-[320px]" onclick="event.stopPropagation()"></div>
        </div>
