<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP · 直邀好友明细全状态原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #e5e7eb; margin: 0; padding: 32px 24px 48px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .gallery-header { max-width: 1200px; margin: 0 auto 28px; }
        .gallery-header h1 { font-size: 22px; font-weight: 900; color: #111827; letter-spacing: -0.02em; }
        .gallery-header p { font-size: 12px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
        .proto-grid { display: flex; flex-wrap: wrap; gap: 36px 28px; align-items: flex-start; justify-content: center; max-width: 1600px; margin: 0 auto; }
        .proto-panel { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .proto-label { width: 375px; font-size: 13px; font-weight: 800; color: #111827; line-height: 1.45; }
        .proto-label .desc { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-top: 4px; }
        .phone-shell {
            width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45); position: relative; border: 4px solid #333; flex-shrink: 0;
        }
        .screen {
            width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden;
            position: relative; display: flex; flex-direction: column;
        }
        .active-tap:active { background-color: #f9fafb; }
        .animate-slide-up { animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<div class="gallery-header">
    <h1>直邀好友明细 · 全状态平铺原型</h1>
    <p>每个手机框代表一种独立页面状态，供 UI 设计对照。</p>
</div>

<div class="proto-grid" id="proto-grid"></div>

<script>
const FRIENDS = [
    {
        addr: '0xd593...Dd2', reg: '2025-11-01',
        volTotal: '1,250,400.00', vol30: '50,400.00', commission: '+125.04', dim: false
    },
    {
        addr: '0x882a...ba1', reg: '2025-10-28',
        volTotal: '45,000.50', vol30: '12,000.50', commission: '+4.50', dim: false
    },
    {
        addr: '0x4e21...9C11', reg: '2025-10-15',
        volTotal: '0.00', vol30: '0.00', commission: '+0.00', dim: true, commissionMuted: true
    }
];

function friendRow(f) {
    const commissionCls = f.commissionMuted ? 'text-gray-400' : 'text-blue-600';
    return `
        <div class="p-5 flex flex-col active-tap transition-colors ${f.dim ? 'opacity-70' : ''}">
            <div class="flex justify-between items-start mb-4">
                <div class="space-y-1">
                    <p class="text-[13px] font-black text-gray-900 font-mono tracking-tight">${f.addr}</p>
                    <p class="text-[10px] text-gray-400 font-bold">註冊時間: <span class="text-gray-500">${f.reg}</span></p>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-x-4 gap-y-4 pt-4 border-t border-gray-50">
                <div>
                    <p class="text-[9px] text-gray-400 font-black uppercase mb-1">累計交易量</p>
                    <p class="text-[12px] font-black text-gray-800">${f.volTotal} <span class="text-[8px] opacity-40">USDT</span></p>
                </div>
                <div class="text-right">
                    <p class="text-[9px] text-gray-400 font-black uppercase mb-1">過去30日交易量</p>
                    <p class="text-[12px] font-black text-gray-800">${f.vol30} <span class="text-[8px] opacity-40">USDT</span></p>
                </div>
                <div class="col-span-2 bg-gray-50/80 rounded-lg p-3 flex justify-between items-center mt-1 border border-gray-100/50">
                    <span class="text-[9px] text-gray-500 font-black uppercase">已產生返佣</span>
                    <span class="text-[13px] font-black ${commissionCls}">${f.commission} <small class="text-[9px]">USDT</small></span>
                </div>
            </div>
        </div>`;
}

function sortSheetHtml(open, activeField = 'volume_total', order = 'desc') {
    const fields = [
        { key: 'volume_total', label: '累计交易额' },
        { key: 'volume_30d', label: '30日交易额' },
        { key: 'commission', label: '返佣金额' }
    ];
    const options = fields.map(f => {
        const active = f.key === activeField;
        const arrow = active ? (order === 'desc' ? '↓' : '↑') : '';
        const indCls = active ? '' : 'hidden';
        return `
            <div class="px-5 py-4 flex justify-between items-center bg-gray-50">
                <span class="text-[13px] font-bold text-gray-900">${f.label}</span>
                <span class="text-blue-600 font-bold text-[10px] sort-indicator ${indCls}">${arrow}</span>
            </div>`;
    }).join('');

    if (!open) return '';

    return `
        <div class="absolute inset-0 z-50 flex items-end rounded-[38px] overflow-hidden">
            <div class="absolute inset-0 bg-black/40"></div>
            <div class="relative w-full bg-white rounded-t-2xl shadow-2xl animate-slide-up">
                <div class="py-4 px-5 border-b border-gray-50">
                    <h3 class="text-[13px] font-black text-gray-900 uppercase tracking-wider">排序方式</h3>
                </div>
                <div class="divide-y divide-gray-50">${options}</div>
                <div class="p-4 border-t border-gray-100">
                    <button type="button" class="w-full py-3 text-[13px] font-bold text-gray-400 bg-gray-50 rounded-xl">取消</button>
                </div>
            </div>
        </div>`;
}

function screenHtml(showSortSheet = false) {
    return `
        <div class="screen flex flex-col">
            <header class="flex justify-between items-center px-6 pt-12 pb-4 shrink-0 bg-white border-b border-gray-50">
                <button type="button" class="p-1">
                    <svg class="w-6 h-6 text-gray-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 class="font-black text-sm uppercase tracking-widest">直邀好友明細</h2>
                <div class="w-8"></div>
            </header>

            <div class="shrink-0 bg-white px-5 py-4 space-y-4 shadow-sm border-b border-gray-100">
                <div class="flex items-center space-x-3">
                    <div class="flex-1 relative bg-gray-100 rounded-xl px-4 py-2.5 flex items-center">
                        <svg class="w-3.5 h-3.5 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2.5"/></svg>
                        <input type="text" placeholder="搜索錢包地址" class="bg-transparent border-none text-[11px] w-full focus:ring-0 outline-none placeholder-gray-400 font-bold" readonly>
                    </div>
                    <button type="button" class="bg-gray-50 p-2.5 rounded-xl border border-gray-100 ${showSortSheet ? 'bg-gray-200' : ''}">
                        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto no-scrollbar bg-gray-50/50">
                <div class="divide-y divide-gray-50 bg-white">
                    ${FRIENDS.map(friendRow).join('')}
                </div>
                <div class="py-12 text-center">
                    <div class="inline-flex flex-col items-center space-y-2">
                        <div class="w-1 h-1 bg-gray-300 rounded-full"></div>
                        <span class="text-[9px] font-black text-gray-300 uppercase tracking-[0.4em]">End of List</span>
                    </div>
                </div>
            </div>

            ${sortSheetHtml(showSortSheet)}
        </div>`;
}

const STATES = [
    {
        title: '① 默认 · 好友列表',
        desc: '搜索栏 + 排序入口；展示直邀好友地址、注册时间、累计/30日交易量、已产生返佣',
        render: () => screenHtml(false)
    },
    {
        title: '② 排序底部弹窗',
        desc: '点击排序按钮后：底部弹出「累计交易额 / 30日交易额 / 返佣金额」选项，支持升降序指示',
        render: () => screenHtml(true)
    }
];

const grid = document.getElementById('proto-grid');
STATES.forEach(state => {
    const panel = document.createElement('div');
    panel.className = 'proto-panel';
    panel.innerHTML = `
        <div class="proto-label">${state.title}<span class="desc">${state.desc}</span></div>
        <div class="phone-shell">${state.render()}</div>`;
    grid.appendChild(panel);
});
</script>

</body>
</html>
