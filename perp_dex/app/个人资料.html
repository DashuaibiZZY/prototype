<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP - 个人资料</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .phone-shell { width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; border: 4px solid #333; }
        .screen { width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .info-card { background: #fff; border: 1px solid #f3f4f6; border-radius: 16px; margin: 0 20px; overflow: hidden; }
        .info-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; gap: 12px; }
        .info-divider { height: 1px; background: #f3f4f6; margin: 0 16px; }
        .copy-btn { flex-shrink: 0; height: 28px; padding: 0 10px; border-radius: 8px; background: #f3f4f6; color: #374151; font-size: 10px; font-weight: 800; border: none; cursor: pointer; }
        .copy-btn:active { background: #e5e7eb; }
        .vip-link { display: block; text-decoration: none; color: inherit; }
        .vip-link:active .info-card { background: #f9fafb; }
    </style>
</head>
<body>

<div class="phone-shell">
    <div class="screen flex flex-col bg-slate-50">

        <header class="flex justify-between items-center px-5 pt-12 pb-3 shrink-0 bg-white border-b border-gray-50">
            <a href="个人中心.html" class="p-1 -ml-1" aria-label="返回">
                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <h1 class="font-black text-[15px] tracking-tight">个人资料</h1>
            <div class="w-6"></div>
        </header>

        <div class="flex-1 overflow-y-auto no-scrollbar pb-8">

            <!-- 头像 -->
            <div class="flex justify-center pt-8 pb-6">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center shadow-lg">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
            </div>

            <!-- 地址 -->
            <div class="info-card">
                <div class="info-row">
                    <div class="min-w-0 flex-1">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">钱包地址</p>
                        <p class="text-[14px] font-black text-gray-900 mt-1 truncate" id="addr-text">0x7a3f...9c2e</p>
                    </div>
                    <button type="button" class="copy-btn" onclick="copyText('0x7a3f8b2c9d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f2a', 'addr-text')">复制</button>
                </div>
            </div>

            <div class="h-3"></div>

            <!-- UID -->
            <div class="info-card">
                <div class="info-row">
                    <div class="min-w-0 flex-1">
                        <p class="text-[14px] font-black text-gray-900">UID：10002345</p>
                    </div>
                    <button type="button" class="copy-btn" onclick="copyText('10002345', null)">复制</button>
                </div>
            </div>

            <div class="h-3"></div>

            <!-- VIP 费率 -->
            <a href="VIP费率等级.html" class="vip-link mx-5">
                <div class="info-card">
                    <div class="info-row pb-2">
                        <p class="text-[13px] font-black text-gray-900">VIP 等级</p>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-black text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-100">VIP 1</span>
                            <svg class="w-4 h-4 text-gray-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                        </div>
                    </div>
                    <div class="info-divider !mx-0"></div>
                    <div class="info-row !pt-3">
                        <p class="text-[10px] font-bold text-gray-400">合约费率</p>
                    </div>
                    <div class="info-row !pt-0 !pb-4">
                        <div class="flex-1 text-center">
                            <p class="text-[10px] font-bold text-gray-400 mb-1">Maker</p>
                            <p class="text-[16px] font-black text-gray-900">0.020%</p>
                        </div>
                        <div class="w-px h-10 bg-gray-100 shrink-0"></div>
                        <div class="flex-1 text-center">
                            <p class="text-[10px] font-bold text-gray-400 mb-1">Taker</p>
                            <p class="text-[16px] font-black text-gray-900">0.050%</p>
                        </div>
                        <svg class="w-4 h-4 text-gray-300 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </a>

        </div>
    </div>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity z-50">已复制</div>

<script>
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0');
    setTimeout(() => t.classList.add('opacity-0'), 1800);
}
function copyText(text, elId) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('已复制'));
    } else {
        showToast('已复制');
    }
}
</script>
</body>
</html>
