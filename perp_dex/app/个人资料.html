<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP · 个人资料全状态原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #e5e7eb; margin: 0; padding: 32px 24px 48px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .gallery-header { max-width: 1200px; margin: 0 auto 28px; }
        .gallery-header h1 { font-size: 22px; font-weight: 900; color: #111827; letter-spacing: -0.02em; }
        .gallery-header p { font-size: 12px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
        .proto-grid { display: flex; flex-wrap: wrap; gap: 36px 28px; align-items: flex-start; justify-content: center; max-width: 1600px; margin: 0 auto; }
        .proto-panel { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .proto-label { width: 375px; font-size: 13px; font-weight: 800; color: #111827; line-height: 1.45; }
        .proto-label .desc { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-top: 4px; }
        .phone-shell {
            width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45); position: relative; border: 4px solid #333; flex-shrink: 0;
        }
        .screen {
            width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden;
            position: relative; display: flex; flex-direction: column;
        }
        .info-card { background: #fff; border: 1px solid #f3f4f6; border-radius: 16px; overflow: hidden; }
        .info-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; gap: 12px; }
        .info-divider { height: 1px; background: #f3f4f6; margin: 0 16px; }
        .copy-btn { flex-shrink: 0; height: 28px; padding: 0 10px; border-radius: 8px; background: #f3f4f6; color: #374151; font-size: 10px; font-weight: 800; border: none; }
        .vip-link { display: block; text-decoration: none; color: inherit; }
        .auth-link { display: block; text-decoration: none; color: inherit; }
        .status-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
        .status-ok { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .status-warn { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    </style>
</head>
<body>

<div class="gallery-header">
    <h1>个人资料 · 全状态平铺原型</h1>
    <p>每个手机框代表一种独立页面状态，供 UI 设计对照。</p>
</div>

<div class="proto-grid" id="proto-grid"></div>

<script>
function headerHtml() {
    return `
        <header class="flex justify-between items-center px-5 pt-12 pb-3 shrink-0 bg-white border-b border-gray-50">
            <a href="个人中心.html" class="p-1 -ml-1" aria-label="返回">
                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <h1 class="font-black text-[15px] tracking-tight">个人资料</h1>
            <div class="w-6"></div>
        </header>`;
}

function avatarHtml() {
    return `
        <div class="flex justify-center pt-8 pb-6">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center shadow-lg">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
        </div>`;
}

function walletBlockHtml() {
    return `
        <div class="info-card">
            <div class="info-row">
                <div class="min-w-0 flex-1">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">钱包地址</p>
                    <p class="text-[14px] font-black text-gray-900 mt-1 truncate">0x7a3f...9c2e</p>
                </div>
                <button type="button" class="copy-btn">复制</button>
            </div>
        </div>`;
}

function emailBlocksHtml() {
    return `
        <div class="info-card">
            <div class="info-row">
                <div class="min-w-0 flex-1">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">邮箱地址</p>
                    <p class="text-[14px] font-black text-gray-900 mt-1 truncate">u***@forx.fi</p>
                </div>
                <button type="button" class="copy-btn">复制</button>
            </div>
        </div>
        <div class="info-card">
            <div class="info-row">
                <div class="min-w-0 flex-1">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">钱包地址</p>
                    <p class="text-[14px] font-black text-gray-900 mt-1 truncate">0x8b2e...4f1a</p>
                    <p class="text-[9px] text-gray-400 mt-1">由 Privy 自动生成，无需关联外部钱包</p>
                </div>
                <button type="button" class="copy-btn">复制</button>
            </div>
        </div>`;
}

function uidBlockHtml() {
    return `
        <div class="info-card">
            <div class="info-row">
                <div class="min-w-0 flex-1">
                    <p class="text-[14px] font-black text-gray-900">UID：10002345</p>
                </div>
                <button type="button" class="copy-btn">复制</button>
            </div>
        </div>`;
}

function authBlockHtml(bound) {
    const badge = bound
        ? '<span class="status-badge status-ok">已设置</span>'
        : '<span class="status-badge status-warn">未设置</span>';
    const sub = bound ? '已绑定身份验证器' : '未绑定';
    return `
        <a href="身份验证器.html" class="auth-link">
            <div class="info-card">
                <div class="info-row">
                    <div class="min-w-0 flex-1">
                        <p class="text-[13px] font-black text-gray-900">身份验证器 App</p>
                        <p class="text-[10px] text-gray-400 mt-1">${sub}</p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        ${badge}
                        <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                    </div>
                </div>
            </div>
        </a>`;
}

function vipBlockHtml() {
    return `
        <a href="VIP费率等级.html" class="vip-link">
            <div class="info-card">
                <div class="info-row">
                    <p class="text-[13px] font-black text-gray-900">VIP 等级</p>
                    <span class="text-[11px] font-black text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-100">VIP 1</span>
                </div>
                <div class="info-divider !mx-0"></div>
                <div class="info-row !pb-2">
                    <p class="text-[11px] font-bold text-gray-500">合约费率</p>
                </div>
                <div class="info-row !pt-0 !pb-4 items-center">
                    <div class="flex-1 min-w-0">
                        <p class="text-[10px] font-bold text-gray-400">Maker</p>
                        <p class="text-[15px] font-black text-gray-900 mt-0.5">0.020%</p>
                    </div>
                    <span class="text-gray-300 font-light px-1 shrink-0">/</span>
                    <div class="flex-1 min-w-0 text-center">
                        <p class="text-[10px] font-bold text-gray-400">Taker</p>
                        <p class="text-[15px] font-black text-gray-900 mt-0.5">0.050%</p>
                    </div>
                    <svg class="w-4 h-4 text-gray-300 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                </div>
            </div>
        </a>`;
}

function screenHtml(cfg) {
    const { loginType = 'wallet', authBound = false } = cfg;
    const identityBlocks = loginType === 'wallet'
        ? walletBlockHtml()
        : `${emailBlocksHtml()}${authBlockHtml(authBound)}`;

    return `
        <div class="screen flex flex-col bg-slate-50">
            ${headerHtml()}
            <div class="flex-1 overflow-y-auto no-scrollbar pb-8">
                ${avatarHtml()}
                <div class="px-5 space-y-3">
                    ${identityBlocks}
                    ${uidBlockHtml()}
                    ${vipBlockHtml()}
                </div>
            </div>
        </div>`;
}

const STATES = [
    {
        title: '① 钱包登录',
        desc: '仅展示连接的钱包地址 + UID + VIP 费率卡片；无身份验证器入口',
        render: () => screenHtml({ loginType: 'wallet' })
    },
    {
        title: '② 邮箱登录 · 验证器未设置',
        desc: '邮箱 + Privy 钱包 + UID + 身份验证器（未设置）+ VIP',
        render: () => screenHtml({ loginType: 'email', authBound: false })
    },
    {
        title: '③ 邮箱登录 · 验证器已设置',
        desc: '邮箱登录下身份验证器显示「已设置」绿色状态，可进入管理页',
        render: () => screenHtml({ loginType: 'email', authBound: true })
    }
];

const grid = document.getElementById('proto-grid');
STATES.forEach(state => {
    const panel = document.createElement('div');
    panel.className = 'proto-panel';
    panel.innerHTML = `
        <div class="proto-label">${state.title}<span class="desc">${state.desc}</span></div>
        <div class="phone-shell">${state.render()}</div>`;
    grid.appendChild(panel);
});
</script>

</body>
</html>
