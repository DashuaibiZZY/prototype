<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX APP - 个人资料</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 20px; gap: 20px; flex-wrap: wrap; }
        .proto-controls { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .proto-btn { background: #111827; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 11px; font-weight: 800; border: none; cursor: pointer; }
        .proto-btn.alt { background: #fff; color: #111827; border: 1px solid #e5e7eb; }
        .proto-btn.active { outline: 2px solid #6366f1; outline-offset: 2px; }
        .phone-shell { width: 375px; height: 812px; background: #000; border-radius: 50px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; border: 4px solid #333; flex-shrink: 0; }
        .screen { width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .info-card { background: #fff; border: 1px solid #f3f4f6; border-radius: 16px; overflow: hidden; }
        .info-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; gap: 12px; }
        .info-divider { height: 1px; background: #f3f4f6; margin: 0 16px; }
        .copy-btn { flex-shrink: 0; height: 28px; padding: 0 10px; border-radius: 8px; background: #f3f4f6; color: #374151; font-size: 10px; font-weight: 800; border: none; cursor: pointer; }
        .copy-btn:active { background: #e5e7eb; }
        .vip-link { display: block; text-decoration: none; color: inherit; }
        .vip-link:active .info-card { background: #f9fafb; }
        .auth-link { display: block; text-decoration: none; color: inherit; }
        .auth-link:active .info-card { background: #f9fafb; }
        .status-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
        .status-ok { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        .status-warn { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    </style>
</head>
<body>

<div class="proto-controls">
    <button type="button" id="btn-wallet" class="proto-btn active" onclick="setLoginType('wallet')">钱包登录</button>
    <button type="button" id="btn-email" class="proto-btn alt" onclick="setLoginType('email')">邮箱登录</button>
</div>

<div class="phone-shell">
    <div class="screen flex flex-col bg-slate-50">

        <header class="flex justify-between items-center px-5 pt-12 pb-3 shrink-0 bg-white border-b border-gray-50">
            <a href="个人中心.html" class="p-1 -ml-1" aria-label="返回">
                <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <h1 class="font-black text-[15px] tracking-tight">个人资料</h1>
            <div class="w-6"></div>
        </header>

        <div class="flex-1 overflow-y-auto no-scrollbar pb-8">

            <div class="flex justify-center pt-8 pb-6">
                <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-gray-800 to-gray-900 flex items-center justify-center shadow-lg">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
            </div>

            <div class="px-5 space-y-3">

                <!-- 钱包登录：仅展示连接的钱包地址 -->
                <div id="block-wallet-only" class="info-card">
                    <div class="info-row">
                        <div class="min-w-0 flex-1">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">钱包地址</p>
                            <p class="text-[14px] font-black text-gray-900 mt-1 truncate">0x7a3f...9c2e</p>
                        </div>
                        <button type="button" class="copy-btn" onclick="copyText('0x7a3f8b2c9d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f2a')">复制</button>
                    </div>
                </div>

                <!-- 邮箱登录：邮箱 -->
                <div id="block-email" class="info-card hidden">
                    <div class="info-row">
                        <div class="min-w-0 flex-1">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">邮箱地址</p>
                            <p class="text-[14px] font-black text-gray-900 mt-1 truncate">u***@forx.fi</p>
                        </div>
                        <button type="button" class="copy-btn" onclick="copyText('user@forx.fi')">复制</button>
                    </div>
                </div>

                <!-- 邮箱登录：Privy 生成钱包 -->
                <div id="block-privy-wallet" class="info-card hidden">
                    <div class="info-row">
                        <div class="min-w-0 flex-1">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide">钱包地址</p>
                            <p class="text-[14px] font-black text-gray-900 mt-1 truncate">0x8b2e...4f1a</p>
                            <p class="text-[9px] text-gray-400 mt-1">由 Privy 自动生成，无需关联外部钱包</p>
                        </div>
                        <button type="button" class="copy-btn" onclick="copyText('0x8b2e1a4f5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c4f1a')">复制</button>
                    </div>
                </div>

                <!-- UID -->
                <div class="info-card">
                    <div class="info-row">
                        <div class="min-w-0 flex-1">
                            <p class="text-[14px] font-black text-gray-900">UID：10002345</p>
                        </div>
                        <button type="button" class="copy-btn" onclick="copyText('10002345')">复制</button>
                    </div>
                </div>

                <!-- 邮箱登录：身份验证器 -->
                <a id="block-authenticator" href="身份验证器.html" class="auth-link hidden">
                    <div class="info-card">
                        <div class="info-row">
                            <div class="min-w-0 flex-1">
                                <p class="text-[13px] font-black text-gray-900">身份验证器 App</p>
                                <p class="text-[10px] text-gray-400 mt-1" id="auth-sub">未绑定 · 提币需二次验证</p>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span id="auth-badge" class="status-badge status-warn">未设置</span>
                                <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                            </div>
                        </div>
                    </div>
                </a>

                <!-- VIP 费率 -->
                <a href="VIP费率等级.html" class="vip-link">
                    <div class="info-card">
                        <div class="info-row">
                            <p class="text-[13px] font-black text-gray-900">VIP 等级</p>
                            <span class="text-[11px] font-black text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-100">VIP 1</span>
                        </div>
                        <div class="info-divider !mx-0"></div>
                        <div class="info-row !pb-2">
                            <p class="text-[11px] font-bold text-gray-500">合约费率</p>
                        </div>
                        <div class="info-row !pt-0 !pb-4 items-center">
                            <div class="flex-1 min-w-0">
                                <p class="text-[10px] font-bold text-gray-400">Maker</p>
                                <p class="text-[15px] font-black text-gray-900 mt-0.5">0.020%</p>
                            </div>
                            <span class="text-gray-300 font-light px-1 shrink-0">/</span>
                            <div class="flex-1 min-w-0 text-center">
                                <p class="text-[10px] font-bold text-gray-400">Taker</p>
                                <p class="text-[15px] font-black text-gray-900 mt-0.5">0.050%</p>
                            </div>
                            <svg class="w-4 h-4 text-gray-300 shrink-0 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                        </div>
                    </div>
                </a>

            </div>
        </div>
    </div>
</div>

<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity z-50">已复制</div>

<script>
const AUTH_STATES = {
    wallet: { bound: false },
    email: { bound: false }
};

function setLoginType(type) {
    const isEmail = type === 'email';
    document.getElementById('block-wallet-only').classList.toggle('hidden', isEmail);
    document.getElementById('block-email').classList.toggle('hidden', !isEmail);
    document.getElementById('block-privy-wallet').classList.toggle('hidden', !isEmail);
    document.getElementById('block-authenticator').classList.toggle('hidden', !isEmail);
    document.getElementById('btn-wallet').classList.toggle('active', !isEmail);
    document.getElementById('btn-wallet').classList.toggle('alt', isEmail);
    document.getElementById('btn-email').classList.toggle('active', isEmail);
    document.getElementById('btn-email').classList.toggle('alt', !isEmail);
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('opacity-0');
    setTimeout(() => t.classList.add('opacity-0'), 1800);
}
function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('已复制'));
    } else {
        showToast('已复制');
    }
}

const params = new URLSearchParams(window.location.search);
if (params.get('login') === 'email') setLoginType('email');
</script>
</body>
</html>
