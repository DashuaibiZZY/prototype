<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX Web · 投资组合全状态原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #111827; }
        body { background: #e5e7eb; margin: 0; padding: 32px 24px 64px; }
        .gallery-header { max-width: 1240px; margin: 0 auto 28px; }
        .gallery-header h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
        .gallery-header p { font-size: 12px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
        .proto-grid { display: flex; flex-direction: column; gap: 48px; align-items: center; max-width: 1240px; margin: 0 auto; }
        .proto-panel { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .proto-label { font-size: 14px; font-weight: 800; line-height: 1.45; }
        .proto-label .desc { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-top: 4px; }
        .web-frame {
            width: 100%; background: #fff; border: 1px solid #d1d5db; border-radius: 12px;
            box-shadow: 0 20px 50px -12px rgba(0,0,0,0.12); overflow: hidden; position: relative;
            min-height: 700px;
        }
        .web-chrome {
            height: 36px; background: #f9fafb; border-bottom: 1px solid #e5e7eb;
            display: flex; align-items: center; padding: 0 14px; gap: 6px;
        }
        .web-chrome .dot { width: 10px; height: 10px; border-radius: 50%; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(4px); }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .dashed-hint { border-bottom: 1px dashed #9ca3af; cursor: help; }
        .copy-icon-btn { color: #9ca3af; padding: 2px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; line-height: 0; }
        .copy-icon-btn:hover { color: #2563eb; }

        /* 顶部主 Tab（资产总览 / 资金账户 / 交易账户） */
        .main-tab-btn {
            position: relative;
            padding: 10px 4px;
            font-size: 15px;
            font-weight: 700;
            color: #6b7280;
            transition: color 0.15s ease;
            cursor: pointer;
            background: transparent;
            border: none;
        }
        .main-tab-btn:hover { color: #111827; }
        .main-tab-btn.is-active {
            color: #111827;
            font-weight: 900;
        }
        .main-tab-btn.is-active::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -1px;
            height: 2.5px;
            background: #111827;
            border-radius: 999px;
        }

        /* 区块数据卡片 */
        .hero-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(17, 24, 39, 0.03);
        }

        /* VIP 广告风横幅（与常规白色数据卡片形成明显视觉区隔） */
        .vip-promo-banner {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            background: linear-gradient(102deg, #0b1020 0%, #171b2e 42%, #291f10 82%, #3a290f 100%);
            border: 1px solid rgba(245, 196, 81, 0.34);
            box-shadow: 0 10px 26px -10px rgba(17, 24, 39, 0.45), inset 0 1px 0 rgba(255, 224, 138, 0.18);
        }
        .vip-promo-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 86% 15%, rgba(251, 191, 36, 0.24), transparent 46%),
                radial-gradient(circle at 12% 95%, rgba(59, 130, 246, 0.16), transparent 44%),
                repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.018) 0px, rgba(255, 255, 255, 0.018) 8px, transparent 8px, transparent 16px);
            pointer-events: none;
        }
        .vip-gold-text {
            background: linear-gradient(90deg, #fde68a 0%, #f59e0b 55%, #fef08a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .vip-cta-btn {
            background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%);
            color: #111827;
            font-weight: 900;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .vip-cta-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }

        /* 交易账户折线图 3 指标切换 Tab */
        .chart-metric-tab {
            position: relative;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
            background: transparent;
        }
        .chart-metric-tab:hover { color: #111827; background: #f3f4f6; }
        .chart-metric-tab.is-active {
            color: #111827;
            font-weight: 900;
            background: #f3f4f6;
            border-color: #e5e7eb;
        }

        /* 底部子 Tab */
        .sub-tab-btn {
            position: relative;
            height: 40px;
            display: inline-flex;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            cursor: pointer;
            flex-shrink: 0;
            border: none;
            background: transparent;
            padding: 0 2px;
            transition: color 0.15s ease;
        }
        .sub-tab-btn:hover { color: #111827; }
        .sub-tab-btn.is-active {
            color: #111827;
            font-weight: 900;
        }
        .sub-tab-btn.is-active::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: #111827;
        }

        /* 体验金子项缩进（对齐合约交易页样式） */
        .trial-sub-box {
            margin-top: 6px;
            margin-left: 4px;
            padding-left: 12px;
            border-left: 2px solid #e5e7eb;
        }

        /* 周期按钮 */
        .period-btn {
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 800;
            border-radius: 4px;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .period-btn:hover { color: #111827; }
        .period-btn.is-active {
            background: #ffffff;
            color: #111827;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

/* ==================== SVG 折线图渲染 ==================== */
function renderLineChartSvg(cfg, gradId) {
    const pts = cfg.points.split(' ').map(p => p.split(',').map(Number));
    const firstX = pts[0][0];
    const last = pts[pts.length - 1];
    const areaPath = `M${pts.map(p => p.join(',')).join(' L')} L${last[0]},120 L${firstX},120 Z`;
    return `
        <div class="flex-1 relative min-h-[132px]">
            <svg class="w-full h-full overflow-visible" viewBox="0 0 608 124" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="${cfg.color}" stop-opacity="0.18"/>
                        <stop offset="100%" stop-color="${cfg.color}" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <!-- 水平参考虚线 -->
                <line x1="0" y1="24" x2="600" y2="24" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="0" y1="62" x2="600" y2="62" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="0" y1="100" x2="600" y2="100" stroke="#f3f4f6" stroke-width="1" stroke-dasharray="3,3"/>
                <!-- 渐变填充区 -->
                <path d="${areaPath}" fill="url(#${gradId})"/>
                <!-- 折线主路径 -->
                <polyline fill="none" stroke="${cfg.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${cfg.points}"/>
            </svg>
            <span class="pointer-events-none absolute w-2.5 h-2.5 rounded-full bg-white border-[2.5px] shadow-sm" style="left: ${(last[0] / 608) * 100}%; top: ${(last[1] / 124) * 100}%; transform: translate(-50%, -50%); border-color: ${cfg.color};"></span>
        </div>
        <div class="flex justify-between pt-2.5 border-t border-gray-100 text-[10px] font-semibold text-gray-400">
            ${cfg.labels.map((lb, i) => `<span class="${i === cfg.labels.length - 1 ? 'text-gray-700 font-bold' : ''}">${lb}</span>`).join('')}
        </div>`;
}

/* ==================== 交互状态切换（按单画框隔离作用域） ==================== */
function setMainView(root, view) {
    root.dataset.activeView = view;
    root.querySelectorAll('[data-main-tab]').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.mainTab === view);
    });
    root.querySelectorAll('[data-view-panel]').forEach(panel => {
        panel.classList.toggle('hidden', panel.dataset.viewPanel !== view);
    });
}

function setFundingSubTab(root, tab) {
    root.querySelectorAll('[data-funding-tab]').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.fundingTab === tab);
    });
    root.querySelectorAll('[data-funding-panel]').forEach(panel => {
        panel.classList.toggle('hidden', panel.dataset.fundingPanel !== tab);
    });
}

function setTradingSubTab(root, tab) {
    root.querySelectorAll('[data-trading-tab]').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.tradingTab === tab);
    });
    const isDeposit = tab === 'deposit-withdraw';
    root.querySelector('[data-trading-panel="referral"]')?.classList.toggle('hidden', isDeposit);
    root.querySelector('[data-trading-panel="deposit-withdraw"]')?.classList.toggle('hidden', !isDeposit);
}

function updateChart(root, scope) {
    const uid = root.dataset.frameUid;
    const guest = root.dataset.guest === 'true';
    const periodGroup = root.querySelector(`[data-period-group="${scope}"]`);
    const activePeriod = periodGroup?.querySelector('.period-btn.is-active')?.dataset.period || '7D';
    const canvas = root.querySelector(`[data-chart-canvas="${scope}"]`);
    if (!canvas) return;

    if (scope === 'overview') {
        const cfg = CHART_SERIES.overview[activePeriod];
        const valEl = root.querySelector('[data-overview-chart-val]');
        if (valEl) valEl.textContent = guest ? '--' : cfg.value;
        canvas.innerHTML = renderLineChartSvg(cfg, `grad-${uid}-ov-${activePeriod}`);
    } else if (scope === 'funding') {
        const cfg = CHART_SERIES.funding[activePeriod];
        const valEl = root.querySelector('[data-funding-chart-val]');
        if (valEl) valEl.textContent = guest ? '--' : cfg.value;
        canvas.innerHTML = renderLineChartSvg(cfg, `grad-${uid}-fd-${activePeriod}`);
    } else if (scope === 'trading') {
        const metric = root.querySelector('[data-trading-metric-tabs] .chart-metric-tab.is-active')?.dataset.chartMetric || 'equity';
        const mGroup = CHART_SERIES.trading[metric];
        const cfg = { ...mGroup[activePeriod], color: mGroup.color };
        const lbEl = root.querySelector('[data-trading-metric-label]');
        const valEl = root.querySelector('[data-trading-metric-val]');
        if (lbEl) lbEl.textContent = mGroup.label;
        if (valEl) {
            valEl.textContent = guest ? '--' : cfg.value;
            valEl.className = 'text-[20px] font-black font-mono ' + (
                guest ? 'text-gray-400' :
                metric === 'pnl' && cfg.value.startsWith('+') ? 'text-emerald-600' :
                metric === 'volume' ? 'text-purple-700' : 'text-gray-900'
            );
        }
        canvas.innerHTML = renderLineChartSvg(cfg, `grad-${uid}-tr-${metric}-${activePeriod}`);
    }
}

/* ==================== 构建并装配单个画框 ==================== */
function renderPortfolioPanel(opts = {}) {
    const uid = ++FRAME_UID;
    const tpl = document.getElementById('tpl-portfolio-base');
    const frag = tpl.content.cloneNode(true);
    const root = frag.querySelector('.portfolio-page-root');
    const guest = !!opts.guest;
    const initialView = opts.view || 'overview';
    const initialFundingTab = opts.fundingTab || 'tokens';
    const initialTradingTab = opts.tradingTab || 'pos';
    const initialTradingMetric = opts.tradingMetric || 'equity';

    root.dataset.frameUid = String(uid);
    root.dataset.guest = guest ? 'true' : 'false';
    root.dataset.feeProfile = opts.customFee ? 'custom' : 'vip';

    // 导航栏与顶部操作按钮
    root.querySelector('[data-portfolio-nav-connect]')?.classList.toggle('hidden', !guest);
    root.querySelector('[data-portfolio-nav-user]')?.classList.toggle('hidden', guest);
    root.querySelector('[data-portfolio-actions-logged]')?.classList.toggle('hidden', guest);

    // 注入两处 VIP 广告风横幅（资产总览 + 交易账户）
    const vipBannerHtml = buildVipPromoBannerHtml(opts);
    root.querySelectorAll('[data-vip-banner-slot]').forEach(slot => {
        slot.innerHTML = vipBannerHtml;
    });

    // 未登录态占位处理
    if (guest) {
        const setTxt = (sel, txt) => { const el = root.querySelector(sel); if (el) el.textContent = txt; };
        setTxt('[data-overview-total]', '--');
        setTxt('[data-overview-pnl]', '--');
        setTxt('[data-overview-pnl-pct]', '--');
        setTxt('[data-overview-funding]', '--');
        setTxt('[data-overview-perp]', '--');
        setTxt('[data-overview-token-count]', '--');
        setTxt('[data-funding-equity]', '--');
        setTxt('[data-trading-equity]', '--');
        setTxt('[data-trading-avail-margin]', '--');
        setTxt('[data-trading-upnl]', '--');
        setTxt('[data-trading-volume]', '--');
        setTxt('[data-trading-trial-total]', '-- USDC');
        setTxt('[data-trading-trial-unused]', '-- USDC');
        setTxt('[data-trading-trial-inuse]', '-- USDC');
        root.querySelectorAll('[data-guest-chart-overlay]').forEach(el => el.classList.remove('hidden'));
    }

    // 渲染代币表格与资金账单
    const ovTbody = root.querySelector('[data-overview-token-tbody]');
    if (ovTbody) ovTbody.innerHTML = renderTokenRows(OVERVIEW_TOKENS, guest);
    const fdTbody = root.querySelector('[data-funding-token-tbody]');
    if (fdTbody) fdTbody.innerHTML = renderTokenRows(FUNDING_TOKENS, guest);
    const billTbody = root.querySelector('[data-fund-bill-tbody]');
    if (billTbody) billTbody.innerHTML = renderFundBillRows(FUND_BILLS, guest);

    // 设置初始视图、子 Tab、交易图指标
    setMainView(root, initialView);
    setFundingSubTab(root, initialFundingTab);
    setTradingSubTab(root, initialTradingTab);
    root.querySelectorAll('[data-trading-metric-tabs] [data-chart-metric]').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.chartMetric === initialTradingMetric);
    });

    // 渲染 3 个区域的折线图
    updateChart(root, 'overview');
    updateChart(root, 'funding');
    updateChart(root, 'trading');

    // 组装外层画框
    const frame = document.createElement('div');
    frame.className = 'web-frame';
    frame.innerHTML = `${webChrome()}<div class="flex flex-col min-h-[680px] relative" data-frame-body></div>`;
    const body = frame.querySelector('[data-frame-body]');
    body.appendChild(root);
    body.insertAdjacentHTML('beforeend', buildVipModalHtml({ guest, visible: !!opts.vipModal }));

    // 绑定所有画框内交互事件
    wireFrameInteractions(frame, root);

    // 若初始展开 VIP 弹窗则填充费率表
    if (opts.vipModal) {
        openPortfolioVipModal(frame, guest);
    }

    return frame;
}

function wireFrameInteractions(frame, root) {
    // 1. 顶部三个主 Tab 切换
    root.querySelectorAll('[data-main-tab]').forEach(btn => {
        btn.addEventListener('click', () => setMainView(root, btn.dataset.mainTab));
    });

    // 资产总览中「资产组合」快捷跳转
    root.querySelectorAll('[data-jump-tab]').forEach(row => {
        row.addEventListener('click', () => setMainView(root, row.dataset.jumpTab));
    });

    // 2. 周期按钮切换（7D / 14D / 30D）
    root.querySelectorAll('[data-period-group]').forEach(group => {
        const scope = group.dataset.periodGroup;
        group.querySelectorAll('[data-period]').forEach(btn => {
            btn.addEventListener('click', () => {
                group.querySelectorAll('[data-period]').forEach(b => b.classList.remove('is-active'));
                btn.classList.add('is-active');
                updateChart(root, scope);
            });
        });
    });

    // 3. 交易账户折线图 3 指标切换（账户价值 / 盈亏 / 交易量）
    root.querySelectorAll('[data-trading-metric-tabs] [data-chart-metric]').forEach(btn => {
        btn.addEventListener('click', () => {
            root.querySelectorAll('[data-trading-metric-tabs] [data-chart-metric]').forEach(b => b.classList.remove('is-active'));
            btn.classList.add('is-active');
            updateChart(root, 'trading');
        });
    });

    // 4. 资金账户底部 3 Tab 切换（代币列表 / 充提记录 / 资金账单）
    root.querySelectorAll('[data-funding-tab]').forEach(btn => {
        btn.addEventListener('click', () => setFundingSubTab(root, btn.dataset.fundingTab));
    });

    // 5. 资金账单筛选栏交互
    const billFilters = root.querySelector('[data-fund-bill-filters]');
    if (billFilters) {
        const select = billFilters.querySelector('[data-fund-bill-type-select]');
        const tbody = root.querySelector('[data-fund-bill-tbody]');
        const guest = root.dataset.guest === 'true';
        const applyBillFilter = () => {
            if (!tbody) return;
            const val = select ? select.value : 'ALL';
            const list = val === 'ALL' ? FUND_BILLS : FUND_BILLS.filter(r => r.mainType === val);
            tbody.innerHTML = renderFundBillRows(list, guest);
        };
        billFilters.querySelectorAll('[data-bill-period]').forEach(btn => {
            btn.addEventListener('click', () => {
                billFilters.querySelectorAll('[data-bill-period]').forEach(b => {
                    b.classList.remove('bg-gray-900', 'text-white');
                    b.classList.add('text-gray-500');
                });
                btn.classList.add('bg-gray-900', 'text-white');
                btn.classList.remove('text-gray-500');
            });
        });
        select?.addEventListener('change', applyBillFilter);
        billFilters.querySelector('[data-fund-bill-query]')?.addEventListener('click', applyBillFilter);
        billFilters.querySelector('[data-fund-bill-reset]')?.addEventListener('click', () => {
            if (select) select.value = 'ALL';
            applyBillFilter();
        });
    }

    // 6. 交易账户底部 7 Tab 切换
    root.querySelectorAll('[data-trading-tab]').forEach(btn => {
        btn.addEventListener('click', () => setTradingSubTab(root, btn.dataset.tradingTab));
    });

    // 7. VIP 广告横幅「等级费率表」按钮打开弹窗
    root.querySelectorAll('[data-portfolio-vip-fee-btn]').forEach(btn => {
        btn.addEventListener('click', () => {
            openPortfolioVipModal(frame, root.dataset.guest === 'true');
        });
    });
}

function openPortfolioVipModal(frame, guest) {
    if (!frame) return;
    const root = frame.querySelector('.portfolio-page-root');
    const customFee = root?.dataset.feeProfile === 'custom';
    const modal = frame.querySelector('.portfolio-vip-modal');
    if (!modal) return;
    const volRow = modal.querySelector('[data-vip-14d-row]');
    if (volRow) volRow.classList.toggle('hidden', guest);
    modal.style.display = 'flex';
    if (window.ForxVipTierApi) {
        ForxVipTierApi.fetchVipTierTable().then(function () {
            ForxVipTierApi.renderFeeTableBody(modal.querySelector('[data-vip-tier-tbody]'), {
                currentLevel: guest || customFee ? null : 2,
                guest: guest || customFee
            });
        });
    }
