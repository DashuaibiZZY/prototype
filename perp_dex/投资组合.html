<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX Web · 投资组合全状态原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; color: #111827; }
        body { background: #e5e7eb; margin: 0; padding: 32px 24px 64px; }
        .gallery-header { max-width: 1240px; margin: 0 auto 28px; }
        .gallery-header h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
        .gallery-header p { font-size: 12px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
        .proto-grid { display: flex; flex-direction: column; gap: 48px; align-items: center; max-width: 1240px; margin: 0 auto; }
        .proto-panel { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .proto-label { font-size: 14px; font-weight: 800; line-height: 1.45; }
        .proto-label .desc { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-top: 4px; }
        .web-frame {
            width: 100%; background: #fff; border: 1px solid #d1d5db; border-radius: 12px;
            box-shadow: 0 20px 50px -12px rgba(0,0,0,0.12); overflow: hidden; position: relative;
            min-height: 720px;
        }
        .web-chrome {
            height: 36px; background: #f9fafb; border-bottom: 1px solid #e5e7eb;
            display: flex; align-items: center; padding: 0 14px; gap: 6px;
        }
        .web-chrome .dot { width: 10px; height: 10px; border-radius: 50%; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(4px); }

        .stats-card { background: white; border: 1px solid #f1f1f1; border-radius: 2px; }
        .tab-active { color: #000; border-bottom: 2px solid #000; font-weight: 800; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .input-row { background: #f9fafb; border: 1px solid #f3f4f6; border-radius: 6px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .input-row:hover { background: #f3f4f6; }
        .btn-step { background: #f1f1f1; color: #111827; border-radius: 6px; width: 100%; text-align: left; padding: 12px; transition: all 0.2s; border: 1px solid transparent; }
        .btn-step:hover { border-color: #d1d5db; background: #fff; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .dashed-hint { border-bottom: 1px dashed #9ca3af; cursor: help; }
        .tab-active { color: #000; border-bottom: 2px solid #000; font-weight: 900; }
        .copy-icon-btn { color: #9ca3af; padding: 2px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; line-height: 0; }
        .copy-icon-btn:hover { color: #2563eb; }
    </style>
</head>
<body>

<div class="gallery-header">
    <h1>Web 投资组合 · 全状态平铺原型</h1>
    <p>桌面端采用<strong>纵向全宽画框</strong>平铺：每个画框含浏览器条 + 完整页面视口。含未登录占位态与已登录默认态，供 UI 对照。</p>
</div>

<div class="proto-grid" id="proto-grid"></div>

<template id="tpl-portfolio-base">
<div class="flex flex-col min-h-0 portfolio-page-root">
<!-- 1. 導航欄（对齐合约交易页元素，无设置图标） -->
<nav class="h-10 border-b border-gray-100 flex items-center px-4 justify-between shrink-0">

            <a href="合约交易.html" class="text-gray-400 hover:text-black">交易</a>
            <a href="投资组合.html" class="text-black font-bold">投資組合</a>
            <a href="活动中心.html" class="text-gray-400 hover:text-black relative">

            <a href="积分.html" class="text-gray-400 hover:text-black">積分</a>

                <div class="bg-white border border-gray-100 rounded-sm py-1 shadow-lg min-w-[140px] overflow-hidden">
                    <a href="卡券中心.html" class="block px-4 py-2 text-[12px] text-gray-500 hover:text-black hover:bg-gray-50 font-bold transition-colors">卡券中心</a>
                    <a href="排行榜.html" class="block px-4 py-2 text-[12px] text-gray-500 hover:text-black hover:bg-gray-50 font-bold transition-colors">排行榜</a>

                    <a href="#" class="block px-4 py-2 text-[12px] text-gray-500 hover:text-black hover:bg-gray-50 transition-colors">公告</a>
                </div>
            </div>
        </div>
    </div>
    <div class="flex items-center space-x-3">
        <button class="flex items-center border border-gray-200 rounded px-1.5 py-0.5 text-gray-400 hover:text-black hover:border-gray-400 transition-colors" title="切換模式" type="button">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round"/>
            </svg>
            <span class="text-[10px] mx-px text-gray-300">/</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>

        <button class="relative text-gray-400 hover:text-black transition-colors" title="消息中心" type="button">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />

            <span class="absolute -top-1 -right-1.5 bg-red-500 text-white text-[8px] font-bold w-3.5 h-3.5 flex items-center justify-center rounded-full leading-none">3</span>

        <div class="relative group cursor-pointer">
            <div class="text-gray-400 group-hover:text-black transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                </svg>
            </div>
            <div class="absolute top-full right-0 hidden group-hover:block pt-2 z-[100]">
                <div class="bg-white border border-gray-100 rounded-sm py-1 shadow-xl min-w-[100px] overflow-hidden">
                    <a href="#" class="block px-3 py-1.5 text-[11px] text-gray-400 hover:text-black hover:bg-gray-50 font-bold transition-colors">English</a>
                    <a href="#" class="block px-3 py-1.5 text-[11px] text-black font-black bg-gray-50">简体中文</a>
                    <a href="#" class="block px-3 py-1.5 text-[11px] text-gray-400 hover:text-black hover:bg-gray-50 font-bold transition-colors">繁体中文</a>
                    <a href="#" class="block px-3 py-1.5 text-[11px] text-gray-400 hover:text-black hover:bg-gray-50 font-bold transition-colors">日本语</a>

            </div>

        <button id="btn-connect-wallet" data-portfolio-nav-connect type="button"
                class="bg-black text-white px-4 py-1.5 rounded-sm text-[11px] font-bold hover:bg-gray-800 transition">
            连接钱包
        </button>

        <div id="user-account-wrapper" data-portfolio-nav-user class="hidden relative group h-12 flex items-center">
            <button class="bg-gray-50 px-3 py-1.5 rounded-sm flex items-center space-x-2 border border-gray-100 hover:bg-gray-100 transition">
                <div class="w-3 h-3 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.4)]"></div>
                <span id="nav-login-label" class="text-[11px] font-black text-gray-900">0xd593...2Dd2</span>
                <svg class="w-3 h-3 text-gray-400 group-hover:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3"/></svg>
            </button>

            <!-- 下拉菜单（丰富版） -->
            <div class="absolute top-full right-0 hidden group-hover:block pt-2 z-[110]">
                <div class="bg-white border border-gray-100 rounded-sm shadow-2xl p-4 min-w-[280px] space-y-4">
                    <!-- UID -->
                    <div class="flex items-center justify-between pb-2 border-b border-gray-50 gap-2">
                        <div class="flex items-center space-x-2 min-w-0">
                            <div class="w-8 h-8 bg-blue-600 rounded-sm flex items-center justify-center text-white font-black text-[10px] shrink-0">FX</div>
                            <span class="text-[10px] text-gray-400">UID: <strong id="menu-uid" class="text-gray-900">123456</strong></span>
                        </div>
                        <button type="button" id="btn-copy-uid" class="copy-icon-btn" onclick="copyMenuField('uid')" title="复制 UID" aria-label="复制 UID">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        </button>
                    </div>

                    <!-- 绑定信息（与 App 一致：钱包登录仅地址；邮箱登录展示邮箱 + Privy 钱包，不可交叉绑定） -->
                    <div class="space-y-2 text-[11px]">
                        <div id="menu-email-row" class="hidden flex justify-between items-center gap-2">
                            <span class="text-gray-400 shrink-0">邮箱</span>
                            <div class="flex items-center gap-1 min-w-0 justify-end">
                                <span id="menu-email-status" class="font-bold text-gray-900 truncate"></span>
                                <button type="button" id="btn-copy-email" class="copy-icon-btn" onclick="copyMenuField('email')" title="复制邮箱" aria-label="复制邮箱">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                </button>
                            </div>
                        </div>
                        <div id="menu-wallet-row" class="flex justify-between items-center gap-2">
                            <span class="text-gray-400 shrink-0" id="menu-wallet-label">钱包</span>
                            <div class="flex items-center gap-1 min-w-0 justify-end">
                                <span id="menu-wallet-status" class="font-bold text-gray-900 truncate text-right"></span>
                                <button type="button" id="btn-copy-wallet" class="copy-icon-btn" onclick="copyMenuField('wallet')" title="复制钱包地址" aria-label="复制钱包地址">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                                </button>
                            </div>
                        </div>
                        <div id="menu-ga-row" class="hidden flex justify-between items-center">
                            <span class="text-gray-400">身份验证器</span>
                            <div id="menu-ga-action" class="text-right"></div>
                        </div>
                    </div>

                    <!-- 总资产 -->
                    <div class="bg-gray-50 p-3 rounded-sm border border-gray-100">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-gray-400 uppercase">总资产价值</span>
                            <span class="text-xl font-black text-gray-900">$12,450.50</span>

                    <!-- 操作按钮 -->

                    </div>

                    <button type="button" id="menu-export-wallet-row" class="hidden w-full flex items-center justify-between px-2 py-2.5 text-[11px] font-bold text-gray-700 hover:text-black hover:bg-gray-50 transition rounded-sm border border-gray-100" onclick="openExportWalletEntry()">
                        <span>导出邮箱钱包</span>
                        <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </button>

                    <!-- 退出登录 -->
                    <button onclick="logout()" class="w-full flex items-center justify-between px-2 py-2 text-[11px] font-bold text-red-400 hover:text-red-600 hover:bg-red-50 transition rounded-sm">
                        <span>退出登录</span>
                        <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="flex-1 overflow-y-auto bg-white">
    <div class="max-w-[1400px] mx-auto p-6 space-y-6">

        <!-- 區塊一：資產權益與操作中心 -->
        <div class="stats-card p-6 border-t-[4px] border-t-blue-600 shadow-lg bg-white">

                    </div>

                    <button type="button" class="px-5 py-2.5 bg-orange-500 text-white rounded-sm font-black text-[11px] hover:bg-orange-600 transition uppercase tracking-widest flex items-center gap-1.5 shadow-sm shadow-orange-500/25">

                    <button onclick="openModal('deposit')" class="px-6 py-2.5 bg-blue-600 text-white rounded-sm font-black text-[11px] hover:bg-blue-700 shadow-lg shadow-blue-600/20 transition uppercase tracking-widest">充值</button>

            <!-- 帳戶分類餘額 (一行式設計) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 pt-6 border-t border-gray-50">

                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] font-bold text-gray-400 uppercase">可用餘額</p>
                        <p class="text-[12px] font-black text-gray-900" data-portfolio-funding-available>2,450.50</p>
                    </div>
                </div>
                <div class="flex items-center justify-between px-4 py-3 bg-blue-50/20 rounded-sm border border-blue-50">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-black text-[10px]">T</div>
                        <div>
                            <p class="text-[10px] font-black text-blue-600 uppercase">交易帳戶</p>
                            <p class="text-sm font-black text-gray-800" data-portfolio-trade-total>10,000.00 <small class="text-[10px] font-medium text-gray-400 uppercase">USDT</small></p>
                        </div>
                    </div>
                    <div class="flex space-x-6">
                        <div class="text-right">
                            <p class="text-[9px] font-bold text-gray-400 uppercase">保證金餘額</p>
                            <p class="text-[12px] font-black text-blue-600" data-portfolio-trade-margin>10,000.00</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 二欄布局容器 -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">

            <!-- 區塊二：VIP 權益卡片 -->
            <div class="xl:col-span-4 space-y-6">
                <div class="bg-gradient-to-br from-gray-900 to-black rounded-sm p-6 text-white shadow-xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-500/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-8">
                            <div class="flex items-center space-x-2">
                                <span class="text-2xl">👑</span>
                                <h3 class="text-xl font-black italic tracking-tighter text-yellow-500" data-portfolio-vip-level>VIP 2</h3>
                            </div>
                            <button data-portfolio-vip-fee-btn onclick="void(0)" class="text-[10px] font-black text-gray-400 border border-gray-700 px-2 py-1 rounded-sm hover:text-yellow-500 hover:border-yellow-500 transition-colors uppercase">等級費率表</button>
                        </div>
                        <div class="space-y-6">
                            <div>
                                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1">过去 14 天交易量</p>
                                <p class="text-2xl font-black font-mono" data-portfolio-vip-14d>$38,500,000.00</p>
                            </div>
                            <div class="grid grid-cols-2 gap-4 py-4 border-y border-white/10" data-portfolio-vip-fees>
                                <div><p class="text-[9px] text-gray-500 font-bold uppercase">Maker 費率</p><p class="text-sm font-black text-green-400" data-portfolio-vip-maker>0.010%</p></div>

                            </div>
                            <div class="pt-2" data-portfolio-vip-progress>
                                <div class="flex justify-between items-end mb-2">
                                    <p class="text-[9px] text-gray-500 font-bold uppercase">升級進度 <span class="text-white ml-1">18%</span></p>

<script>

}

function clonePortfolioBase() {
    const tpl = document.getElementById('tpl-portfolio-base');
    return tpl.content.querySelector('.portfolio-page-root').cloneNode(true);
}

function q(root, sel) { return root.querySelector(sel); }

function applyGuestState(root) {

    if (pnl) pnl.classList.add('hidden');
    const setText = (sel, text) => { const el = q(root, sel); if (el) el.textContent = text; };
    const setHtml = (sel, html) => { const el = q(root, sel); if (el) el.innerHTML = html; };

    setText('[data-portfolio-funding-available]', '--');
    setHtml('[data-portfolio-trade-total]', '-- <small class="text-[10px] font-medium text-gray-400 uppercase">USDT</small>');
    setText('[data-portfolio-trade-margin]', '--');
    setText('[data-portfolio-vip-level]', '--');
    setText('[data-portfolio-vip-14d]', '--');
    setText('[data-portfolio-vip-maker]', '--');
    setText('[data-portfolio-vip-taker]', '--');
    setText('[data-portfolio-margin-ratio]', '--');
    setText('[data-portfolio-unrealized-pnl]', '--');
    setText('[data-portfolio-maint-margin]', '--');
    setText('[data-portfolio-lifetime-volume]', '--');

    if (marginRatio) marginRatio.className = 'text-2xl font-black text-gray-400';
    root.dataset.guest = 'true';
    q(root, '[data-portfolio-vip-progress]')?.classList.add('hidden');

    if (feeBtn) feeBtn.className = 'text-[10px] font-black text-gray-400 border border-gray-700 px-2 py-1 rounded-sm hover:text-yellow-500 hover:border-yellow-500 transition-colors uppercase cursor-pointer';

    q(root, '[data-portfolio-referral-hint]')?.classList.remove('hidden');
    q(root, '[data-portfolio-data-table]')?.classList.add('hidden');
}

function applyLoggedInState(root, opts = {}) {
    root.dataset.guest = 'false';
    q(root, '[data-portfolio-nav-connect]')?.classList.add('hidden');
    q(root, '[data-portfolio-nav-user]')?.classList.remove('hidden');
    q(root, '[data-portfolio-actions-logged]')?.classList.remove('hidden');
    const total = q(root, '[data-portfolio-equity-total]');
    if (total) total.innerHTML = '12,450.50 <small class="text-sm font-bold text-gray-400 uppercase">USDT</small>';
    const pnl = q(root, '[data-portfolio-equity-pnl]');
    if (pnl) {
        pnl.classList.remove('hidden');
        pnl.textContent = '今日盈虧 +420.15 (+3.42%)';
        pnl.className = 'text-[12px] font-bold text-green-500 bg-green-50 px-2 py-0.5 rounded-sm';
    }
    const marginRatio = q(root, '[data-portfolio-margin-ratio]');
    if (marginRatio) {
        marginRatio.textContent = '0.00%';
        marginRatio.className = 'text-2xl font-black text-blue-600';
    }
    const unrealized = q(root, '[data-portfolio-unrealized-pnl]');
    if (unrealized) unrealized.innerHTML = '0.00 <small class="text-gray-400">USDT</small>';
    const maintMargin = q(root, '[data-portfolio-maint-margin]');
    if (maintMargin) maintMargin.innerHTML = '0.00 <small class="text-gray-400">USDT</small>';
    const lifetime = q(root, '[data-portfolio-lifetime-volume]');
    if (lifetime) lifetime.textContent = '$138,500,000.00';
    q(root, '[data-portfolio-vip-progress]')?.classList.remove('hidden');
    const feeBtn = q(root, '[data-portfolio-vip-fee-btn]');
    if (feeBtn) feeBtn.className = 'text-[10px] font-black text-gray-400 border border-gray-700 px-2 py-1 rounded-sm hover:text-yellow-500 hover:border-yellow-500 transition-colors uppercase cursor-pointer';
    q(root, '[data-portfolio-chart-panel]')?.classList.remove('opacity-30');
    q(root, '[data-portfolio-guest-hint]')?.classList.add('hidden');
    const label = q(root, '#nav-login-label');
    if (label && opts.email) label.textContent = opts.email;
    const emailRow = q(root, '#menu-email-row');
    const gaRow = q(root, '#menu-ga-row');
    const exportRow = q(root, '#menu-export-wallet-row');
    if (opts.email) {
        emailRow?.classList.remove('hidden');
        gaRow?.classList.remove('hidden');
        exportRow?.classList.remove('hidden');
        const es = q(root, '#menu-email-status');

        const ws = q(root, '#menu-wallet-status');
        if (ws) ws.textContent = '0x8b2e...4f1a';
    } else {
        emailRow?.classList.add('hidden');
        gaRow?.classList.add('hidden');
        exportRow?.classList.add('hidden');
    }
    if (opts.depositTab) {
        q(root, '[data-portfolio-referral-hint]')?.classList.add('hidden');
        q(root, '[data-portfolio-data-table]')?.classList.add('hidden');
        q(root, '#deposit-withdraw-filters')?.classList.add('hidden');
        q(root, '[data-portfolio-deposit-placeholder]')?.classList.remove('hidden');
        root.querySelectorAll('[id^="tab-data-"]').forEach(el => {
            el.classList.remove('tab-active');
            el.classList.add('text-gray-400');
        });
        const dw = q(root, '#tab-data-deposit-withdraw');
        if (dw) { dw.classList.add('tab-active'); dw.classList.remove('text-gray-400'); }
    }
}

function buildFrame(innerHtml) {
    return `<div class="web-frame">${webChrome()}<div class="flex flex-col min-h-[700px] relative">${innerHtml}</div></div>`;
}

function renderPortfolio(opts = {}) {
    const root = clonePortfolioBase();
    if (opts.guest) applyGuestState(root);

                <span class="text-[10px] font-bold text-gray-500">过去 14 天交易量</span>
                <span class="text-sm font-black font-mono text-gray-900 shrink-0">$38,500,000.00</span>

            <table class="w-full text-left border-collapse">

                <tr class="bg-gray-50 text-[10px] font-black text-gray-400 uppercase tracking-wider">

                    <th class="px-4 py-3 border-b border-gray-100">14天交易量門檻 (USD)</th>
                    <th class="px-4 py-3 border-b border-gray-100">Maker 費率</th>
                    <th class="px-4 py-3 border-b border-gray-100 text-right">Taker 費率</th>
                </tr>
                </thead>
                <tbody class="text-[11px] font-bold text-gray-700">
                <tr class="hover:bg-gray-50"><td class="px-4 py-3 border-b border-gray-50">VIP 0</td><td class="px-4 py-3 border-b border-gray-50">&lt; $5M</td><td class="px-4 py-3 border-b border-gray-50 font-mono">0.015%</td><td class="px-4 py-3 border-b border-gray-50 text-right font-mono">0.045%</td></tr>
                <tr class="hover:bg-gray-50"><td class="px-4 py-3 border-b border-gray-50">VIP 1</td><td class="px-4 py-3 border-b border-gray-50">≥ $5M 且 &lt; $25M</td><td class="px-4 py-3 border-b border-gray-50 font-mono">0.013%</td><td class="px-4 py-3 border-b border-gray-50 text-right font-mono">0.039%</td></tr>
                ${vip2Row}
                <tr class="hover:bg-gray-50"><td class="px-4 py-3 border-b border-gray-50">VIP 3</td><td class="px-4 py-3 border-b border-gray-50">≥ $100M 且 &lt; $500M</td><td class="px-4 py-3 border-b border-gray-50 font-mono">0.006%</td><td class="px-4 py-3 border-b border-gray-50 text-right font-mono">0.029%</td></tr>
                <tr class="hover:bg-gray-50"><td class="px-4 py-3 border-b border-gray-50">VIP 4</td><td class="px-4 py-3 border-b border-gray-50">≥ $500M</td><td class="px-4 py-3 border-b border-gray-50 font-mono">0.004%</td><td class="px-4 py-3 border-b border-gray-50 text-right font-mono">0.026%</td></tr>

function openPortfolioVipModal(frame, guest) {
    if (!frame) return;
    let modal = frame.querySelector('.portfolio-vip-modal');
    if (!modal) {
        const host = frame.querySelector('.flex.flex-col.min-h-\\[700px\\]') || frame.querySelector('.flex.flex-col');
        if (host) host.insertAdjacentHTML('beforeend', buildVipModalHtml({ guest, visible: false }));
        modal = frame.querySelector('.portfolio-vip-modal');
    }
    if (!modal) return;
    const volRow = modal.querySelector('[data-vip-14d-row]');
    if (volRow) volRow.classList.toggle('hidden', guest);
    modal.style.display = 'flex';
}

function wirePortfolioVipButtons() {
    document.querySelectorAll('[data-portfolio-vip-fee-btn]').forEach(btn => {
        btn.onclick = () => {
            const frame = btn.closest('.web-frame');
            const root = btn.closest('.portfolio-page-root');
            const guest = root?.dataset.guest === 'true';
            openPortfolioVipModal(frame, guest);
        };
    });
}

const STATES = [
    {
        title: '① 未登录 · 默认',
        desc: '总净资产为 --；顶部导航栏「连接钱包」；VIP 区可点击「等級費率表」查看弹窗（无14天交易量、不标记档位）',

        title: '①b 未登录 · VIP 费率弹窗',
        desc: '未登录点击「等級費率表」：弹窗不展示过去14天交易量，费率表不高亮用户档位',
        render: () => renderPortfolio({ guest: true, vipModal: true })

        render: () => renderPortfolio({ guest: false })

    {
        title: '③ 已登录 · 充提记录 Tab',
        desc: '底部切换到「充提記錄」标签，展示 Gary 原型占位说明（不展示表格与筛选）',
        render: () => renderPortfolio({ guest: false, depositTab: true })

    {

        desc: '点击「等級費率表」打开 VIP 费率详情弹窗（含专属权益与当前档位标记）',
        render: () => renderPortfolio({ guest: false, vipModal: true })
    }
];

const grid = document.getElementById('proto-grid');
STATES.forEach(state => {
    const panel = document.createElement('div');
    panel.className = 'proto-panel';
    panel.innerHTML = `
        <div class="proto-label">${state.title}<span class="desc">${state.desc}</span></div>

    grid.appendChild(panel);
});
wirePortfolioVipButtons();
</script>
