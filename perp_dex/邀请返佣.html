        .tier-node { position: relative; display: flex; flex-direction: column; align-items: center; flex: 1; }
        .tier-line { position: absolute; top: 12px; left: 50%; width: 100%; height: 2px; background: #f3f4f6; z-index: 0; }
        .tier-node:last-child .tier-line { display: none; }
        .tier-circle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #f3f4f6; background: white; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #d1d5db; }

        .tier-node.earned .tier-circle { background: #000; border-color: #000; color: #fff; }
        .tier-node.earned .tier-line { background: #000; }
        .tooltip-box { visibility: hidden; opacity: 0; transition: opacity 0.2s; bottom: 125%; left: 50%; transform: translateX(-50%); white-space: nowrap; }
        .group:hover .tooltip-box { visibility: visible; opacity: 1; }
        .sort-th { cursor: pointer; user-select: none; }
        .sort-th:hover { color: #111827; }
        .sort-indicator { font-size: 10px; font-weight: 900; color: #9ca3af; }
        .sort-indicator.active { color: #000; }
        .faq-item { border-bottom: 1px solid #f3f4f6; padding: 16px 0; }
        .faq-item:last-child { border-bottom: none; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }

function sortIndicator(field, activeField, order) {
