<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ForX Admin - 排行榜虚拟用户数据配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #111827; }
        .target-badge-platform { background: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        .target-badge-activity { background: #f5f3ff; color: #6d28d9; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        .virtual-badge { background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; }
        .input-label { display: block; font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.05em; }
        .search-input { border: 1px solid #e2e8f0; border-radius: 4px; padding: 6px 10px; font-size: 11px; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: #3b82f6; }
        .search-input:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }
        .scope-type-btn { flex: 1; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 11px; font-weight: 800; color: #64748b; background: #fff; transition: all 0.15s; }
        .scope-type-btn.active { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; box-shadow: inset 0 0 0 1px #2563eb; }
        .scope-type-btn.activity.active { border-color: #7c3aed; background: #f5f3ff; color: #6d28d9; box-shadow: inset 0 0 0 1px #7c3aed; }
        .scope-type-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .hint-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 4px; padding: 8px 10px; font-size: 10px; color: #64748b; line-height: 1.5; }
        .warn-box { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 4px; padding: 8px 10px; font-size: 10px; color: #9a3412; line-height: 1.5; }
        .activity-combobox-panel { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 120; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.375rem; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12); overflow: hidden; }
        .activity-option { display: block; width: 100%; text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 700; color: #334155; }
        .activity-option:hover { background: #f8fafc; }
        .activity-option.selected { background: #f5f3ff; color: #6d28d9; }
        .batch-table input { width: 100%; }
        /* Tailwind flex 会覆盖 hidden，子页必须用 !important 隐藏 */
        .admin-subview {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        .admin-subview.hidden {
            display: none !important;
        }
        #batch-effective-controls.hidden,
        #batch-effective-readonly.hidden {
            display: none !important;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[12px]">

<aside id="admin-sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0"></aside>

<main class="flex-1 flex flex-col overflow-hidden">
  <div id="view-list" class="admin-subview">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
      <div>
        <h1 class="text-lg font-bold text-slate-800 italic uppercase">排行榜虚拟用户数据配置</h1>
        <p class="text-[10px] text-slate-400 mt-0.5">仅虚拟用户；模拟数据配置后不可停用</p>
      </div>
      <button type="button" data-ranking-action="open-batch" class="bg-blue-600 text-white px-4 py-2 rounded-sm font-black hover:bg-blue-700 uppercase">+ 新增配置</button>
    </header>
    <div class="flex-1 overflow-y-auto p-8 space-y-4">
      <section class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
        <div class="grid grid-cols-12 gap-3 items-end">
          <div class="col-span-4">
            <label class="input-label">UID / 钱包</label>
            <input type="text" id="filter-address" placeholder="输入 UID 或钱包" class="search-input w-full">
          </div>
          <div class="col-span-3">
            <label class="input-label">榜单范围</label>
            <select id="filter-scope-type" class="search-input w-full bg-white font-bold" onchange="onFilterScopeChange()">
              <option value="all">全部</option>
              <option value="platform">全平台</option>
              <option value="activity">平台活动</option>
            </select>
          </div>
          <div class="col-span-3">
            <label class="input-label">活动名称</label>
            <input type="text" id="filter-activity-name" placeholder="输入活动名关键词" class="search-input w-full" disabled>
          </div>
          <div class="col-span-2 flex justify-end space-x-2">
            <button onclick="applyFilters()" class="px-6 bg-slate-900 text-white font-bold py-1.5 rounded">筛选</button>
            <button onclick="resetFilters()" class="px-6 border border-slate-200 text-slate-400 font-bold py-1.5 rounded">重置</button>
          </div>
        </div>
      </section>
      <section class="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/30">
          <div class="flex items-center space-x-4">
            <h2 class="font-black text-slate-700 uppercase tracking-tighter">虚拟用户配置列表</h2>
            <span id="filter-result-hint" class="text-[10px] text-slate-400 font-bold">共 0 条</span>
          </div>
        </div>
        <table class="w-full text-left">
          <thead class="bg-slate-50 text-slate-400 font-black text-[10px] uppercase border-b border-slate-100">
          <tr>
            <th class="px-6 py-4">UID / 标识</th>
            <th class="px-6 py-4">榜单范围</th>
            <th class="px-6 py-4 text-right">配置指标</th>
            <th class="px-6 py-4 text-center">活动排序维度</th>
            <th class="px-6 py-4">数据时间</th>
            <th class="px-6 py-4 text-right">操作</th>
          </tr>
          </thead>
          <tbody id="config-table-body" class="divide-y divide-slate-50 text-[11px] font-medium"></tbody>
        </table>
        <div id="config-table-pagination"></div>
      </section>
    </div>
  </div>

  <div id="view-batch" class="admin-subview hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
      <div class="flex items-center gap-4">
        <button type="button" data-ranking-action="back-list" class="text-slate-400 hover:text-slate-800 font-black">← 返回列表</button>
        <div>
          <h1 class="text-lg font-bold text-slate-800 italic uppercase" id="batch-page-title">新增虚拟用户配置</h1>
          <p class="text-[10px] text-slate-400 mt-0.5" id="batch-page-subtitle">默认 1 条，可添加至最多 10 条；共享榜单范围与生效策略</p>
        </div>
      </div>
      <div class="flex gap-2 items-center">
        <span id="batch-count-hint" class="text-[10px] text-slate-400 font-bold mr-2">0 / 10 条</span>
        <button type="button" data-ranking-action="back-list" class="px-4 py-2 border border-slate-200 text-slate-500 font-bold rounded-sm">取消</button>
        <button type="button" data-ranking-action="save-batch" class="px-6 py-2 bg-blue-600 text-white font-black rounded-sm">保存</button>
      </div>
    </header>
    <div class="flex-1 overflow-y-auto p-8 space-y-4">
      <section class="bg-white border border-slate-200 rounded-lg p-6 space-y-4 shadow-sm">
        <div class="warn-box">仅支持<strong>虚拟用户</strong>。配置保存后持续参与榜单，<strong>不可停用</strong>。编辑时<strong>交易额、积分</strong>仅可上调。</div>
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="input-label">榜单范围</label>
            <div class="flex gap-2 mt-1">
              <button type="button" id="batch-scope-platform" class="scope-type-btn active" onclick="setBatchScope('platform')">全平台</button>
              <button type="button" id="batch-scope-activity" class="scope-type-btn activity" onclick="setBatchScope('activity')">平台活动</button>
            </div>
          </div>
          <div id="batch-activity-wrap" class="hidden">
            <label class="input-label">选择活动</label>
            <div id="batch-activity-combobox" class="relative mt-1"></div>
          </div>
          <div id="batch-effective-wrap">
            <label class="input-label">生效策略</label>
            <div id="batch-effective-controls" class="flex gap-3 items-center mt-1 flex-wrap">
              <label class="flex items-center gap-1 font-bold"><input type="radio" name="batch-effective" value="now" checked onchange="onBatchEffectiveChange()"> 立即</label>
              <label class="flex items-center gap-1 font-bold"><input type="radio" name="batch-effective" value="scheduled" onchange="onBatchEffectiveChange()"> 指定日期</label>
              <input type="date" id="batch-effective-date" disabled class="search-input">
            </div>
            <div id="batch-effective-readonly" class="hidden mt-1">
              <p class="font-bold text-slate-700" id="batch-effective-readonly-value">—</p>
              <p class="text-[9px] text-slate-400 italic mt-1">编辑态不可修改生效策略</p>
            </div>
          </div>
        </div>
      </section>
      <section class="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
        <div class="p-4 border-b bg-slate-50/50 flex justify-between items-center">
          <h3 class="font-black text-slate-700 uppercase" id="batch-detail-title">配置明细（最多 10 条）</h3>
          <button type="button" data-ranking-action="add-batch-row" id="btn-add-batch-row" class="px-3 py-1.5 bg-slate-900 text-white font-black rounded-sm text-[10px] uppercase">+ 添加一行</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left batch-table">
            <thead class="bg-slate-50 text-slate-400 font-black text-[10px] uppercase border-b">
            <tr id="batch-table-head"></tr>
            </thead>
            <tbody id="batch-table-body" class="divide-y text-[11px]"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</main>

<script src="admin-pagination.js"></script>
<script src="admin-copy-chip.js"></script>
<script src="admin-ranking-config.js?v=20260901b"></script>
<script src="admin-permission-registry.js"></script>
<script src="admin-permission-store.js"></script>
<script src="admin-permissions.js"></script>
<script src="admin-sidebar.js"></script>
<script>
  initAdminSidebar('leaderboard', '登录身份: 运营管理员');
  if (typeof refreshRankingAdminList === 'function') refreshRankingAdminList();
</script>
</body>
</html>
