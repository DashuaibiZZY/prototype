<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX Admin · 做市商数据看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .sidebar-item-active { background: #1e293b; color: #fff; border-left: 4px solid #3b82f6; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[12px]">

<aside id="admin-sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0"></aside>

<main class="flex-1 flex flex-col overflow-hidden">
    <header class="h-14 bg-white border-b border-slate-200 flex items-center px-8 shrink-0">
        <h1 class="text-lg font-bold text-slate-800">做市商数据看板</h1>
    </header>
    <div class="flex-1 overflow-y-auto p-8 space-y-4">
        <section class="card p-5">
            <div class="flex flex-wrap items-end gap-4">
                <div class="min-w-[220px]">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">做市商团队</label>
                    <select id="mm-dashboard-team-filter" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white font-bold outline-none focus:ring-2 focus:ring-violet-500"></select>
                </div>
                <button type="button" id="mm-dashboard-query" class="px-8 py-2.5 bg-slate-900 text-white rounded-lg text-sm font-black">查询</button>
            </div>
        </section>
        <section class="card overflow-hidden">
            <table class="w-full text-left min-w-[720px]">
                <thead class="bg-slate-50 border-b border-slate-200 text-[10px] font-bold text-slate-500 uppercase">
                <tr>
                    <th class="px-4 py-3">做市商团队</th>
                    <th class="px-4 py-3 text-right">总资产</th>
                    <th class="px-4 py-3 text-right">前一日总交易额</th>
                    <th class="px-4 py-3 text-center">团队账号数</th>
                    <th class="px-4 py-3 text-right">操作</th>
                </tr>
                </thead>
                <tbody id="mm-dashboard-list-body" class="divide-y divide-slate-50 text-[12px]"></tbody>
            </table>
        </section>
    </div>
</main>

<script src="admin-mm-team-store.js?v=20261110-mm-polish2"></script>
<script src="admin-mm-dashboard.js?v=20261110-mm-polish2"></script>
<script src="admin-sidebar.js?v=20261110-mm-polish2"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        AdminMmDashboard.initListPage();
    });
</script>
</body>
</html>
