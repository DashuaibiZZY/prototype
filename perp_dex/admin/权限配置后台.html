<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForX Admin - 权限与用户</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    .sidebar-item-active { background: #1e293b; color: #fff; border-left: 4px solid #3b82f6; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .role-item-active { background: #eff6ff; border-color: #3b82f6; }
    .perm-check { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    .perm-check:hover { background: #f8fafc; }
    .perm-check input { margin-top: 2px; }
    .tab-active { background: #0f172a; color: #fff; }
    .status-on { background: #ecfdf5; color: #059669; }
    .status-off { background: #f1f5f9; color: #64748b; }
    .status-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  </style>
</head>
<body class="flex h-screen overflow-hidden text-[12px]">

<aside id="admin-sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0"></aside>

<main class="flex-1 flex flex-col overflow-hidden">
  <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
    <div>
      <h1 id="page-title" class="text-xl font-bold text-slate-800">角色与权限</h1>
      <p class="text-xs text-slate-400 mt-0.5">配置角色权限矩阵与后台用户（单用户单角色）</p>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-sm text-slate-500">管理员</span>
      <div class="w-8 h-8 bg-slate-200 rounded-full flex items-center justify-center text-xs font-bold text-slate-600">管理</div>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto p-8 space-y-4">
    <div class="flex gap-2">
      <button id="tab-btn-roles" type="button" onclick="showPermTab('roles')" class="tab-active px-4 py-2 rounded-lg text-sm font-bold">角色管理</button>
      <button id="tab-btn-users" type="button" onclick="showPermTab('users')" class="px-4 py-2 rounded-lg text-sm font-bold border border-slate-200 text-slate-600">后台用户</button>
      <div class="flex-1"></div>
      <button type="button" id="btn-reset-store" onclick="confirmResetStore()" class="text-xs font-bold text-slate-500 border border-slate-200 px-3 py-2 rounded-lg hover:bg-slate-50">恢复默认配置</button>
    </div>

    <div id="page-roles" class="flex gap-4 min-h-[560px]">
      <div class="card w-72 shrink-0 flex flex-col">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
          <span class="font-bold text-slate-700">角色列表</span>
          <button type="button" id="btn-add-role" onclick="openAddRoleModal()" class="text-xs font-bold text-blue-600 hover:underline">+ 自定义</button>
        </div>
        <div id="roleList" class="p-2 space-y-1 flex-1 overflow-y-auto min-h-[200px]"></div>
        <div class="p-3 border-t border-slate-100 text-[10px] text-slate-400">内置角色不可删除；左侧选中角色后右侧配置权限范围</div>
      </div>
      <div class="card flex-1 flex flex-col min-w-0">
        <div id="matrixHeader" class="p-4 border-b border-slate-100"></div>
        <div id="matrixBody" class="flex-1 overflow-y-auto p-4 space-y-4 min-h-[320px]"></div>
        <div id="matrixFooter" class="p-4 border-t border-slate-100 flex justify-end gap-2"></div>
      </div>
    </div>

    <div id="page-users" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <p class="text-sm text-slate-500">每个用户仅绑定 <b>一个</b> 角色；登录后菜单与敏感操作由该角色权限矩阵决定（见文档说明）。</p>
        <button type="button" id="btn-add-user" onclick="openAddUserModal()" class="bg-slate-900 text-white px-4 py-2.5 rounded-lg text-sm font-bold">+ 新增后台用户</button>
      </div>
      <div class="card overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 border-b">
            <tr>
              <th class="px-4 py-3 text-xs font-bold text-slate-500">姓名</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">登录账号</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">角色</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">状态</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">最近登录</th>
              <th class="px-4 py-3 text-xs font-bold text-slate-500 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="divide-y divide-slate-50"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div id="modal-add-role" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
  <div class="card w-full max-w-md p-6 space-y-4">
    <h3 class="text-lg font-bold text-slate-800">新增自定义角色</h3>
    <div>
      <label class="block text-xs font-bold text-slate-500 mb-2">角色名称</label>
      <input id="newRoleName" type="text" placeholder="如：外包审核" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 mb-2">说明</label>
      <input id="newRoleDesc" type="text" placeholder="可选" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none">
    </div>
    <div class="flex gap-2 pt-2">
      <button type="button" onclick="closeModal('modal-add-role')" class="flex-1 py-2.5 border border-slate-200 rounded-lg font-bold text-slate-600">取消</button>
      <button type="button" onclick="submitAddRole()" class="flex-1 py-2.5 bg-slate-900 text-white rounded-lg font-bold">创建</button>
    </div>
  </div>
</div>

<div id="modal-add-user" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
  <div class="card w-full max-w-md p-6 space-y-4">
    <h3 id="userModalTitle" class="text-lg font-bold text-slate-800">新增后台用户</h3>
    <input type="hidden" id="editUserId">
    <div>
      <label class="block text-xs font-bold text-slate-500 mb-2">姓名</label>
      <input id="userFormName" type="text" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 mb-2">登录账号（邮箱）</label>
      <input id="userFormAccount" type="email" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 mb-2">角色（单选）</label>
      <select id="userFormRole" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm bg-white outline-none"></select>
    </div>
    <div class="flex gap-2 pt-2">
      <button type="button" onclick="closeModal('modal-add-user')" class="flex-1 py-2.5 border border-slate-200 rounded-lg font-bold text-slate-600">取消</button>
      <button type="button" onclick="submitUserForm()" class="flex-1 py-2.5 bg-slate-900 text-white rounded-lg font-bold">保存</button>
    </div>
  </div>
</div>

<script src="admin-permission-registry.js"></script>
<script src="admin-permission-store.js"></script>
<script src="admin-permissions.js"></script>
<script src="admin-sidebar.js"></script>
<script>
  var selectedRoleId = 'admin';
  var editingPerms = [];

  function openModal(id) {
    var el = document.getElementById(id);
    el.classList.remove('hidden');
    el.classList.add('flex');
  }
  function closeModal(id) {
    var el = document.getElementById(id);
    el.classList.add('hidden');
    el.classList.remove('flex');
  }

  function showPermTab(tab) {
    document.getElementById('page-roles').classList.toggle('hidden', tab !== 'roles');
    document.getElementById('page-users').classList.toggle('hidden', tab !== 'users');
    document.getElementById('tab-btn-roles').className = tab === 'roles' ? 'tab-active px-4 py-2 rounded-lg text-sm font-bold' : 'px-4 py-2 rounded-lg text-sm font-bold border border-slate-200 text-slate-600';
    document.getElementById('tab-btn-users').className = tab === 'users' ? 'tab-active px-4 py-2 rounded-lg text-sm font-bold' : 'px-4 py-2 rounded-lg text-sm font-bold border border-slate-200 text-slate-600';
    document.getElementById('page-title').textContent = tab === 'roles' ? '角色与权限' : '后台用户';
    if (tab === 'users') renderUserTable();
    else refreshRolesPanel();
    if (location.hash !== '#' + tab) location.hash = tab;
  }

  function roleUsesWildcard(role) {
    return role.perms && role.perms.indexOf('*') !== -1;
  }

  function permIsOn(permId) {
    return editingPerms.indexOf(permId) !== -1;
  }

  function renderRoleList() {
    var store = loadPermissionStore();
    if (!store.roles.length) {
      document.getElementById('roleList').innerHTML = '<p class="p-4 text-center text-slate-400 text-xs">无角色数据，请点击「恢复默认配置」</p>';
      return;
    }
    document.getElementById('roleList').innerHTML = store.roles.map(function (r) {
      var active = r.id === selectedRoleId ? 'role-item-active border-2' : 'border border-transparent';
      var tag = r.builtin ? '<span class="text-[9px] text-slate-400">内置</span>' : '<span class="text-[9px] text-blue-500">自定义</span>';
      var count = roleUsesWildcard(r) ? '全部' : (r.perms ? r.perms.length : 0);
      return '<button type="button" onclick="selectRole(\'' + r.id + '\')" class="w-full text-left p-3 rounded-lg border ' + active + ' hover:bg-slate-50">' +
        '<div class="flex justify-between items-center"><span class="font-bold text-slate-800">' + r.name + '</span>' + tag + '</div>' +
        '<p class="text-[10px] text-slate-400 mt-1 line-clamp-2">' + (r.description || '') + '</p>' +
        '<p class="text-[10px] text-slate-500 mt-1">已配置 ' + count + ' 项权限</p>' +
        '</button>';
    }).join('');
  }

  function selectRole(roleId) {
    selectedRoleId = roleId;
    var store = loadPermissionStore();
    var role = store.roles.find(function (r) { return r.id === roleId; });
    if (!role) return;
    if (roleUsesWildcard(role)) {
      editingPerms = (typeof getConfigurableAdminPermIds === 'function' ? getConfigurableAdminPermIds() : getAllAdminPermIds()).slice();
    } else {
      editingPerms = (role.perms || []).slice();
    }
    renderRoleList();
    renderMatrix(role);
  }

  function refreshRolesPanel() {
    renderRoleList();
    var store = loadPermissionStore();
    if (!store.roles.length) {
      document.getElementById('matrixHeader').innerHTML = '';
      document.getElementById('matrixBody').innerHTML = '<p class="text-slate-400 text-sm p-4">暂无角色，请恢复默认配置</p>';
      document.getElementById('matrixFooter').innerHTML = '';
      return;
    }
    var role = store.roles.find(function (r) { return r.id === selectedRoleId; });
    if (!role) {
      selectedRoleId = store.roles[0].id;
      role = store.roles[0];
    }
    selectRole(role.id);
  }

  function togglePerm(permId, checked) {
    if (checked) {
      if (editingPerms.indexOf(permId) === -1) editingPerms.push(permId);
    } else {
      editingPerms = editingPerms.filter(function (p) { return p !== permId; });
    }
    var store = loadPermissionStore();
    var role = store.roles.find(function (r) { return r.id === selectedRoleId; });
    renderMatrix(role);
  }

  function toggleGroup(groupId, checked) {
    var g = ADMIN_PERM_GROUPS.find(function (x) { return x.id === groupId; });
    if (!g) return;
    var ids = g.menus.map(function (m) { return m.id; }).concat(g.actions.map(function (a) { return a.id; }));
    ids.forEach(function (id) {
      if (checked) {
        if (editingPerms.indexOf(id) === -1) editingPerms.push(id);
      } else {
        editingPerms = editingPerms.filter(function (p) { return p !== id; });
      }
    });
    var store = loadPermissionStore();
    var role = store.roles.find(function (r) { return r.id === selectedRoleId; });
    renderMatrix(role);
  }

  function renderMatrix(role) {
    if (!role) return;
    var allIds = typeof getConfigurableAdminPermIds === 'function' ? getConfigurableAdminPermIds() : getAllAdminPermIds();
    var wildcard = editingPerms.length >= allIds.length;
    document.getElementById('matrixHeader').innerHTML =
      '<div class="flex flex-wrap items-start justify-between gap-3">' +
        '<div><h2 class="text-base font-bold text-slate-800">' + role.name + ' · 权限范围</h2>' +
        '<p class="text-xs text-slate-400 mt-1">' + (role.description || '') + '</p></div>' +
        (wildcard ? '<span class="status-tag bg-violet-100 text-violet-700">全部权限</span>' : '<span class="text-xs text-slate-400">已选 ' + editingPerms.length + ' / ' + allIds.length + ' 项</span>') +
      '</div>';

    var body = '';
    ADMIN_PERM_GROUPS.forEach(function (g) {
      var ids = g.menus.map(function (m) { return m.id; }).concat(g.actions.map(function (a) { return a.id; }));
      var allOn = ids.every(function (id) { return permIsOn(id); });
      body += '<div class="border border-slate-100 rounded-lg overflow-hidden">';
      body += '<div class="bg-slate-50 px-4 py-2.5 flex items-center justify-between">';
      body += '<span class="font-bold text-slate-700 text-sm">' + g.label + '</span>';
      body += '<button type="button" onclick="toggleGroup(\'' + g.id + '\',' + (!allOn) + ')" class="text-xs font-bold text-blue-600">' + (allOn ? '取消全选' : '全选本模块') + '</button>';
      body += '</div><div class="p-3 grid grid-cols-2 gap-1">';
      g.menus.forEach(function (m) {
        var on = permIsOn(m.id);
        body += '<label class="perm-check"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="togglePerm(\'' + m.id + '\',this.checked)"><span><span class="font-medium text-slate-700">' + m.label + '</span><span class="block text-[10px] text-slate-400">菜单可见</span></span></label>';
      });
      g.actions.forEach(function (a) {
        var on = permIsOn(a.id);
        body += '<label class="perm-check' + (a.sensitive ? ' bg-amber-50/50' : '') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="togglePerm(\'' + a.id + '\',this.checked)"><span><span class="font-medium ' + (a.sensitive ? 'text-amber-700' : 'text-slate-700') + '">' + a.label + '</span><span class="block text-[10px] text-slate-400">' + (a.sensitive ? '敏感操作' : '动作') + '</span></span></label>';
      });
      body += '</div></div>';
    });

    var sensitive = getAdminSensitiveActions();
    body += '<div class="border-2 border-amber-200 bg-amber-50/40 rounded-lg p-4">';
    body += '<h3 class="text-sm font-bold text-amber-800 mb-2">敏感操作汇总</h3>';
    body += '<div class="flex flex-wrap gap-2">';
    sensitive.forEach(function (a) {
      var on = permIsOn(a.id);
      body += '<span class="px-2 py-1 rounded text-[10px] font-bold ' + (on ? 'bg-amber-200 text-amber-900' : 'bg-white text-slate-400 border border-slate-200') + '">' + a.label + '</span>';
    });
    body += '</div></div>';

    document.getElementById('matrixBody').innerHTML = body;

    var footer = '<button type="button" onclick="selectRole(\'' + role.id + '\')" class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-bold text-slate-600">重置</button>';
    footer += '<button type="button" onclick="saveRoleMatrix()" class="px-6 py-2.5 bg-slate-900 text-white rounded-lg text-sm font-bold">保存角色权限</button>';
    if (!role.builtin) {
      footer += '<button type="button" onclick="deleteCustomRole(\'' + role.id + '\')" class="px-4 py-2 text-red-600 text-sm font-bold">删除角色</button>';
    }
    document.getElementById('matrixFooter').innerHTML = footer;
  }

  function saveRoleMatrix() {
    var store = loadPermissionStore();
    var role = store.roles.find(function (r) { return r.id === selectedRoleId; });
    if (!role) return;
    var allIds = typeof getConfigurableAdminPermIds === 'function' ? getConfigurableAdminPermIds() : getAllAdminPermIds();
    if (editingPerms.length >= allIds.length) {
      role.perms = ['*'];
      editingPerms = allIds.slice();
    } else {
      role.perms = editingPerms.slice();
    }
    savePermissionStore(store);
    renderRoleList();
    renderMatrix(role);
    alert('已保存「' + role.name + '」的权限配置');
  }

  function openAddRoleModal() {
    document.getElementById('newRoleName').value = '';
    document.getElementById('newRoleDesc').value = '';
    openModal('modal-add-role');
  }

  function submitAddRole() {
    var name = document.getElementById('newRoleName').value.trim();
    if (!name) { alert('请输入角色名称'); return; }
    var store = loadPermissionStore();
    var id = 'custom_' + Date.now();
    store.roles.push({
      id: id,
      name: name,
      builtin: false,
      description: document.getElementById('newRoleDesc').value.trim(),
      perms: []
    });
    savePermissionStore(store);
    closeModal('modal-add-role');
    selectRole(id);
  }

  function deleteCustomRole(roleId) {
    if (!confirm('确认删除该自定义角色？')) return;
    var store = loadPermissionStore();
    store.roles = store.roles.filter(function (r) { return r.id !== roleId; });
    store.users.forEach(function (u) {
      if (u.roleId === roleId) u.roleId = 'test';
    });
    savePermissionStore(store);
    selectRole('admin');
  }

  function renderUserTable() {
    var store = loadPermissionStore();
    document.getElementById('userTableBody').innerHTML = store.users.map(function (u) {
      var role = store.roles.find(function (r) { return r.id === u.roleId; });
      var st = u.status === 'active' ? '<span class="status-tag status-on">启用</span>' : '<span class="status-tag status-off">停用</span>';
      var actions = '<button type="button" onclick="openEditUser(\'' + u.id + '\')" class="text-blue-600 font-bold">编辑</button>';
      if (u.id !== 'u_admin') actions += ' <button type="button" onclick="deleteUser(\'' + u.id + '\')" class="text-red-600 font-bold">删除</button>';
      return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-bold">' + u.name + '</td><td class="px-3 py-3 font-mono text-xs">' + u.account + '</td><td class="px-3 py-3">' + (role ? role.name : u.roleId) + '</td><td class="px-3 py-3">' + st + '</td><td class="px-3 py-3 text-slate-500">' + (u.lastLogin || '—') + '</td><td class="px-4 py-3 text-right">' + actions + '</td></tr>';
    }).join('');
  }

  function fillRoleSelect(selectId, selected) {
    var store = loadPermissionStore();
    document.getElementById(selectId).innerHTML = store.roles.map(function (r) {
      return '<option value="' + r.id + '"' + (r.id === selected ? ' selected' : '') + '>' + r.name + '</option>';
    }).join('');
  }

  function openAddUserModal() {
    document.getElementById('userModalTitle').textContent = '新增后台用户';
    document.getElementById('editUserId').value = '';
    document.getElementById('userFormName').value = '';
    document.getElementById('userFormAccount').value = '';
    fillRoleSelect('userFormRole', 'ops');
    openModal('modal-add-user');
  }

  function openEditUser(userId) {
    var store = loadPermissionStore();
    var u = store.users.find(function (x) { return x.id === userId; });
    if (!u) return;
    document.getElementById('userModalTitle').textContent = '编辑后台用户';
    document.getElementById('editUserId').value = u.id;
    document.getElementById('userFormName').value = u.name;
    document.getElementById('userFormAccount').value = u.account;
    fillRoleSelect('userFormRole', u.roleId);
    openModal('modal-add-user');
  }

  function submitUserForm() {
    var name = document.getElementById('userFormName').value.trim();
    var account = document.getElementById('userFormAccount').value.trim();
    var roleId = document.getElementById('userFormRole').value;
    if (!name || !account) { alert('请填写姓名与账号'); return; }
    var store = loadPermissionStore();
    var editId = document.getElementById('editUserId').value;
    if (editId) {
      var u = store.users.find(function (x) { return x.id === editId; });
      if (u) {
        u.name = name;
        u.account = account;
        u.roleId = roleId;
      }
    } else {
      store.users.push({
        id: 'u_' + Date.now(),
        name: name,
        account: account,
        roleId: roleId,
        status: 'active',
        lastLogin: '—'
      });
    }
    savePermissionStore(store);
    closeModal('modal-add-user');
    renderUserTable();
  }

  function deleteUser(userId) {
    if (!confirm('确认删除该用户？')) return;
    var store = loadPermissionStore();
    store.users = store.users.filter(function (u) { return u.id !== userId; });
    savePermissionStore(store);
    renderUserTable();
  }

  function confirmResetStore() {
    if (!confirm('恢复为默认角色与用户配置？自定义角色将丢失。')) return;
    resetPermissionStore();
    selectedRoleId = 'admin';
    refreshRolesPanel();
    renderUserTable();
    alert('已恢复默认配置');
  }

  function boot() {
    initAdminSidebar('sys-admin', '权限配置 · 数据存于 localStorage');
    var hash = (location.hash || '').replace('#', '') || 'roles';
    if (hash === 'users') showPermTab('users');
    else showPermTab('roles');
  }

  window.addEventListener('hashchange', function () {
    var hash = (location.hash || '').replace('#', '') || 'roles';
    if (hash === 'users') showPermTab('users');
    else showPermTab('roles');
  });

  window.addEventListener('admin-perm-store-change', function () {
    if (!document.getElementById('page-users').classList.contains('hidden')) renderUserTable();
    else refreshRolesPanel();
  });

  boot();
</script>
</body>
</html>
