<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForX Admin - 权限与用户</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    .sidebar-item-active { background: #1e293b; color: #fff; border-left: 4px solid #3b82f6; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .tab-active { background: #0f172a; color: #fff; }
    .status-on { background: #ecfdf5; color: #059669; }
    .status-off { background: #f1f5f9; color: #64748b; }
    .status-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .modal-nav-item { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 6px; font-size: 11px; color: #cbd5e1; }
    .modal-nav-item:hover { background: #1e293b; color: #fff; }
    .modal-nav-item.active { background: #1e293b; color: #fff; border-left: 3px solid #3b82f6; }
    .modal-nav-module { font-size: 9px; font-weight: 700; color: #64748b; text-transform: uppercase; padding: 8px 12px 4px; letter-spacing: .05em; }
    .rw-btn { padding: 4px 12px; font-size: 11px; font-weight: 600; border: 1px solid #e2e8f0; color: #64748b; background: #fff; }
    .rw-btn:first-child { border-radius: 6px 0 0 6px; }
    .rw-btn:last-child { border-radius: 0 6px 6px 0; }
    .rw-btn + .rw-btn { border-left: none; }
    .rw-btn.sel-none { background: #f1f5f9; color: #475569; }
    .rw-btn.sel-read { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
    .rw-btn.sel-write { background: #0f172a; color: #fff; border-color: #0f172a; }
    .perm-row:target { background: #eff6ff; }
  </style>
</head>
<body class="flex h-screen overflow-hidden text-[12px]">

<aside id="admin-sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0"></aside>

<main class="flex-1 flex flex-col overflow-hidden">
  <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
    <div>
      <h1 id="page-title" class="text-xl font-bold text-slate-800">后台人员</h1>
      <p id="page-subtitle" class="text-xs text-slate-400 mt-0.5">编辑人员时配置全部页面读/写与敏感操作组</p>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-sm text-slate-500">产品总监</span>
      <div class="w-8 h-8 bg-slate-200 rounded-full flex items-center justify-center text-xs font-bold text-slate-600">管理</div>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto p-8 space-y-4">
    <div class="flex gap-2 flex-wrap">
      <button id="tab-btn-staff" type="button" onclick="showPermTab('staff')" class="tab-active px-4 py-2 rounded-lg text-sm font-bold">后台人员</button>
      <button id="tab-btn-groups" type="button" onclick="showPermTab('groups')" class="px-4 py-2 rounded-lg text-sm font-bold border border-slate-200 text-slate-600">敏感操作组</button>
      <div class="flex-1"></div>
      <button type="button" onclick="confirmResetStore()" class="text-xs font-bold text-slate-500 border border-slate-200 px-3 py-2 rounded-lg hover:bg-slate-50">恢复默认配置</button>
    </div>

    <div id="page-staff" class="space-y-4">
      <div class="flex justify-between items-center">
        <p class="text-sm text-slate-500">点击 <b>编辑</b> 打开侧栏式弹窗，一次性配置页面读/写 + 敏感组。</p>
        <button type="button" onclick="openUserModal()" class="bg-slate-900 text-white px-4 py-2.5 rounded-lg text-sm font-bold">+ 新增后台人员</button>
      </div>
      <div class="card overflow-hidden">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 border-b">
            <tr>
              <th class="px-4 py-3 text-xs font-bold text-slate-500">姓名</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">登录账号</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">业务部门备注</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">页面写</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">敏感组</th>
              <th class="px-3 py-3 text-xs font-bold text-slate-500">状态</th>
              <th class="px-4 py-3 text-xs font-bold text-slate-500 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="staffTableBody" class="divide-y divide-slate-50"></tbody>
        </table>
      </div>
    </div>

    <div id="page-groups" class="hidden space-y-4">
      <p class="text-sm text-slate-500">各模块 <b>独立</b> 审批池；待办进入节点后从对应组 <b>纯随机</b> 派单。人员归属请在编辑人员弹窗中勾选，此处为只读总览。</p>
      <div id="groupsOverview" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
    </div>
  </div>
</main>

<!-- 编辑人员 · 侧栏弹窗 -->
<div id="modal-user" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
  <div class="card w-full max-w-5xl h-[88vh] flex flex-col overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between shrink-0">
      <div>
        <h3 id="userModalTitle" class="text-lg font-bold text-slate-800">编辑后台人员</h3>
        <p class="text-xs text-slate-400 mt-0.5">左侧跳转模块 · 右侧配置全部页面读/写与敏感组</p>
      </div>
      <button type="button" onclick="closeModal('modal-user')" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
    </div>
    <input type="hidden" id="editUserId">
    <div class="flex flex-1 min-h-0">
      <nav id="modalSideNav" class="w-52 bg-slate-900 shrink-0 overflow-y-auto py-3"></nav>
      <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-slate-50/50">
        <section class="card p-4 space-y-3">
          <h4 class="font-bold text-slate-800 text-sm">基本信息</h4>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="text-xs font-bold text-slate-500">姓名</label><input id="userFormName" type="text" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none"></div>
            <div><label class="text-xs font-bold text-slate-500">登录账号</label><input id="userFormAccount" type="email" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none"></div>
            <div><label class="text-xs font-bold text-slate-500">业务部门备注</label><input id="userFormDepartment" type="text" placeholder="如：市场部" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none"></div>
            <div><label class="text-xs font-bold text-slate-500">状态</label><select id="userFormStatus" class="w-full mt-1 border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white outline-none"><option value="active">启用</option><option value="inactive">停用</option></select></div>
          </div>
        </section>
        <section>
          <h4 class="font-bold text-slate-800 text-sm mb-3">页面权限（无 / 读 / 写）</h4>
          <div id="modalPagePerms" class="space-y-3"></div>
        </section>
        <section id="agentCapSection" class="hidden card p-4 border-2 border-blue-200 bg-blue-50/40">
          <label class="block text-sm font-bold text-blue-900 mb-2">一级代理返佣比例上限（%）</label>
          <input id="userFormAgentCap" type="number" min="1" max="100" class="w-32 border border-blue-200 rounded-lg px-3 py-2 text-sm">
          <p class="text-[10px] text-blue-700 mt-2">「一级代理管理」为写时必填。</p>
        </section>
        <section>
          <h4 class="font-bold text-slate-800 text-sm mb-3">敏感操作组（按模块独立）</h4>
          <div id="modalGroupPerms" class="space-y-3"></div>
        </section>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-2 shrink-0 bg-white">
      <button type="button" onclick="closeModal('modal-user')" class="px-4 py-2.5 border border-slate-200 rounded-lg font-bold text-slate-600">取消</button>
      <button type="button" onclick="submitUserForm()" class="px-6 py-2.5 bg-slate-900 text-white rounded-lg font-bold">保存</button>
    </div>
  </div>
</div>

<script src="admin-permission-registry.js"></script>
<script src="admin-permission-store.js"></script>
<script src="admin-permissions.js"></script>
<script src="admin-sidebar.js"></script>
<script>
  var editDraft = { pagePerms: {}, groupIds: {}, agentMaxRebate: null };

  function openModal(id) {
    document.getElementById(id).classList.remove('hidden');
    document.getElementById(id).classList.add('flex');
  }
  function closeModal(id) {
    document.getElementById(id).classList.add('hidden');
    document.getElementById(id).classList.remove('flex');
  }

  function showPermTab(tab) {
    document.getElementById('page-staff').classList.toggle('hidden', tab !== 'staff');
    document.getElementById('page-groups').classList.toggle('hidden', tab !== 'groups');
    document.getElementById('tab-btn-staff').className = tab === 'staff' ? 'tab-active px-4 py-2 rounded-lg text-sm font-bold' : 'px-4 py-2 rounded-lg text-sm font-bold border border-slate-200 text-slate-600';
    document.getElementById('tab-btn-groups').className = tab === 'groups' ? 'tab-active px-4 py-2 rounded-lg text-sm font-bold' : 'px-4 py-2 rounded-lg text-sm font-bold border border-slate-200 text-slate-600';
    document.getElementById('page-title').textContent = tab === 'staff' ? '后台人员' : '敏感操作组';
    document.getElementById('page-subtitle').textContent = tab === 'staff' ? '编辑人员时配置全部页面读/写与敏感操作组' : '各模块独立审批池 · 纯随机派单';
    if (tab === 'staff') renderStaffTable();
    if (tab === 'groups') renderGroupsOverview();
    if (location.hash !== '#' + tab) location.hash = tab;
  }

  function countWritePerms(perms) {
    var n = 0;
    Object.keys(perms || {}).forEach(function (k) { if (perms[k] === 'write') n++; });
    return n;
  }

  function countUserGroups(store, userId) {
    return (store.groups || []).filter(function (g) { return (g.memberIds || []).indexOf(userId) !== -1; }).length;
  }

  function renderStaffTable() {
    var store = loadPermissionStore();
    document.getElementById('staffTableBody').innerHTML = store.users.map(function (u) {
      var st = u.status === 'active' ? '<span class="status-tag status-on">启用</span>' : '<span class="status-tag status-off">停用</span>';
      var actions = '<button type="button" onclick="openUserModal(\'' + u.id + '\')" class="text-blue-600 font-bold">编辑</button>';
      if (!u.protected) actions += ' <button type="button" onclick="deleteUser(\'' + u.id + '\')" class="text-red-600 font-bold">删除</button>';
      return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-bold">' + u.name + '</td><td class="px-3 py-3 font-mono text-xs">' + u.account + '</td><td class="px-3 py-3">' + (u.department || '—') + '</td><td class="px-3 py-3">' + countWritePerms(u.pagePerms) + ' 项</td><td class="px-3 py-3">' + countUserGroups(store, u.id) + ' 组</td><td class="px-3 py-3">' + st + '</td><td class="px-4 py-3 text-right">' + actions + '</td></tr>';
    }).join('');
  }

  function renderGroupsOverview() {
    var store = loadPermissionStore();
    var byMod = getAdminGroupsByModule();
    var html = '';
    Object.keys(byMod).forEach(function (mod) {
      html += '<div class="card p-4"><h3 class="font-bold text-slate-800 mb-3">' + mod + '</h3><div class="space-y-3">';
      byMod[mod].forEach(function (meta) {
        var g = store.groups.find(function (x) { return x.id === meta.id; }) || { memberIds: [] };
        var members = (g.memberIds || []).map(function (uid) {
          var u = store.users.find(function (x) { return x.id === uid; });
          return u ? u.name : uid;
        });
        html += '<div class="border border-amber-100 bg-amber-50/30 rounded-lg p-3"><div class="font-bold text-amber-900 text-sm">' + meta.label + '</div><p class="text-[10px] text-slate-500 mt-1">' + meta.description + '</p><div class="flex flex-wrap gap-1 mt-2">' +
          (members.length ? members.map(function (n) { return '<span class="px-2 py-0.5 bg-amber-200 text-amber-900 rounded text-[10px] font-bold">' + n + '</span>'; }).join('') : '<span class="text-slate-400 text-[10px]">暂无成员</span>') +
          '</div></div>';
      });
      html += '</div></div>';
    });
    document.getElementById('groupsOverview').innerHTML = html;
  }

  function buildModalSideNav() {
    var byMod = getAdminPagesByModule();
    var html = '<div class="px-3 pb-2 text-white font-black italic text-sm">页面导航</div>';
    Object.keys(byMod).forEach(function (mod) {
      html += '<div class="modal-nav-module">' + mod + '</div>';
      byMod[mod].forEach(function (p) {
        html += '<a href="#perm-' + p.id + '" class="modal-nav-item" onclick="highlightNav(this)">' + p.label + '</a>';
      });
    });
    html += '<div class="modal-nav-module mt-2">敏感组</div><a href="#section-groups" class="modal-nav-item" onclick="highlightNav(this)">敏感操作组</a>';
    document.getElementById('modalSideNav').innerHTML = html;
  }

  function highlightNav(el) {
    document.querySelectorAll('.modal-nav-item').forEach(function (n) { n.classList.remove('active'); });
    if (el) el.classList.add('active');
  }

  function rwButtons(pageId, level) {
    var opts = [{ v: 'none', l: '无' }, { v: 'read', l: '读' }, { v: 'write', l: '写' }];
    return opts.map(function (o) {
      var cls = 'rw-btn' + (level === o.v ? ' sel-' + o.v : '');
      return '<button type="button" class="' + cls + '" onclick="setDraftPagePerm(\'' + pageId + '\',\'' + o.v + '\')">' + o.l + '</button>';
    }).join('');
  }

  function setDraftPagePerm(pageId, level) {
    editDraft.pagePerms[pageId] = level;
    if (pageId === 'agent.mgmt' && level !== 'write') editDraft.agentMaxRebate = null;
    renderModalPermEditors();
  }

  function setDraftGroup(groupId, checked) {
    editDraft.groupIds[groupId] = checked;
    renderModalPermEditors();
  }

  function renderModalPermEditors() {
    var byMod = getAdminPagesByModule();
    var pageHtml = '';
    Object.keys(byMod).forEach(function (mod) {
      pageHtml += '<div class="card overflow-hidden"><div class="bg-slate-100 px-4 py-2 font-bold text-slate-700 text-xs">' + mod + '</div><div class="divide-y divide-slate-50">';
      byMod[mod].forEach(function (p) {
        var level = editDraft.pagePerms[p.id] || 'none';
        pageHtml += '<div id="perm-' + p.id + '" class="perm-row px-4 py-3 flex flex-wrap items-center justify-between gap-2 scroll-mt-4"><div><span class="font-medium text-slate-800">' + p.label + '</span><span class="block text-[10px] text-slate-400">' + p.writeHint + '</span></div><div class="flex">' + rwButtons(p.id, level) + '</div></div>';
      });
      pageHtml += '</div></div>';
    });
    document.getElementById('modalPagePerms').innerHTML = pageHtml;

    var showCap = (editDraft.pagePerms['agent.mgmt'] || 'none') === 'write';
    document.getElementById('agentCapSection').classList.toggle('hidden', !showCap);
    if (showCap) document.getElementById('userFormAgentCap').value = editDraft.agentMaxRebate != null ? editDraft.agentMaxRebate : '';

    var grpByMod = getAdminGroupsByModule();
    var grpHtml = '';
    Object.keys(grpByMod).forEach(function (mod) {
      grpHtml += '<div class="card p-3"><div class="font-bold text-xs text-slate-600 mb-2">' + mod + '</div><div class="space-y-2">';
      grpByMod[mod].forEach(function (g) {
        var on = !!editDraft.groupIds[g.id];
        grpHtml += '<label class="flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 cursor-pointer"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="setDraftGroup(\'' + g.id + '\',this.checked)"><span><span class="font-medium text-amber-900">' + g.label + '</span><span class="block text-[10px] text-slate-400">' + g.description + '</span></span></label>';
      });
      grpHtml += '</div></div>';
    });
    document.getElementById('modalGroupPerms').innerHTML = grpHtml;
  }

  function openUserModal(userId) {
    buildModalSideNav();
    var store = loadPermissionStore();
    editDraft = { pagePerms: {}, groupIds: {}, agentMaxRebate: null };

    if (userId) {
      var u = store.users.find(function (x) { return x.id === userId; });
      if (!u) return;
      document.getElementById('userModalTitle').textContent = '编辑 · ' + u.name;
      document.getElementById('editUserId').value = u.id;
      document.getElementById('userFormName').value = u.name;
      document.getElementById('userFormAccount').value = u.account;
      document.getElementById('userFormDepartment').value = u.department || '';
      document.getElementById('userFormStatus').value = u.status || 'active';
      ADMIN_PAGES.forEach(function (p) {
        editDraft.pagePerms[p.id] = (u.pagePerms && u.pagePerms[p.id]) || 'none';
      });
      editDraft.agentMaxRebate = u.agentMaxRebate;
      ADMIN_SENSITIVE_GROUPS.forEach(function (g) {
        editDraft.groupIds[g.id] = userInGroup(store, u.id, g.id);
      });
    } else {
      document.getElementById('userModalTitle').textContent = '新增后台人员';
      document.getElementById('editUserId').value = '';
      document.getElementById('userFormName').value = '';
      document.getElementById('userFormAccount').value = '';
      document.getElementById('userFormDepartment').value = '';
      document.getElementById('userFormStatus').value = 'active';
      ADMIN_PAGES.forEach(function (p) { editDraft.pagePerms[p.id] = 'none'; });
      ADMIN_SENSITIVE_GROUPS.forEach(function (g) { editDraft.groupIds[g.id] = false; });
    }
    renderModalPermEditors();
    openModal('modal-user');
  }

  function submitUserForm() {
    var name = document.getElementById('userFormName').value.trim();
    var account = document.getElementById('userFormAccount').value.trim();
    if (!name || !account) { alert('请填写姓名与账号'); return; }
    if ((editDraft.pagePerms['agent.mgmt'] || 'none') === 'write') {
      var cap = parseInt(document.getElementById('userFormAgentCap').value, 10);
      if (!cap || cap < 1) { alert('请填写一级代理返佣比例上限'); return; }
      editDraft.agentMaxRebate = cap;
    }
    var store = loadPermissionStore();
    var editId = document.getElementById('editUserId').value;
    var user;
    if (editId) {
      user = store.users.find(function (x) { return x.id === editId; });
    } else {
      user = { id: 'u_' + Date.now(), lastLogin: '—', protected: false };
      store.users.push(user);
    }
    user.name = name;
    user.account = account;
    user.department = document.getElementById('userFormDepartment').value.trim();
    user.status = document.getElementById('userFormStatus').value;
    user.pagePerms = Object.assign({}, editDraft.pagePerms);
    user.agentMaxRebate = editDraft.agentMaxRebate;

    ADMIN_SENSITIVE_GROUPS.forEach(function (g) {
      setUserInGroup(store, user.id, g.id, !!editDraft.groupIds[g.id]);
    });

    savePermissionStore(store);
    closeModal('modal-user');
    renderStaffTable();
  }

  function deleteUser(userId) {
    if (!confirm('确认删除？')) return;
    var store = loadPermissionStore();
    store.users = store.users.filter(function (u) { return u.id !== userId; });
    store.groups.forEach(function (g) {
      g.memberIds = (g.memberIds || []).filter(function (id) { return id !== userId; });
    });
    savePermissionStore(store);
    renderStaffTable();
  }

  function confirmResetStore() {
    if (!confirm('恢复默认人员、页面权限与敏感组？')) return;
    resetPermissionStore();
    showPermTab('staff');
    alert('已恢复默认配置');
  }

  function boot() {
    initAdminSidebar('sys-admin', '权限 v3.1 · 按模块独立审批组');
    var hash = (location.hash || '').replace('#', '') || 'staff';
    showPermTab(hash === 'groups' ? 'groups' : 'staff');
  }

  window.addEventListener('hashchange', function () {
    var hash = (location.hash || '').replace('#', '') || 'staff';
    showPermTab(hash === 'groups' ? 'groups' : 'staff');
  });

  boot();
</script>
</body>
</html>
