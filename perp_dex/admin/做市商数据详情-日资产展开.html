<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForX Admin · 团队日资产明细</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .sidebar-item-active { background: #1e293b; color: #fff; border-left: 4px solid #3b82f6; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-[12px]">

<aside id="admin-sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0"></aside>

<main class="flex-1 flex flex-col overflow-hidden">
    <header class="h-14 bg-white border-b border-slate-200 flex items-center px-6 shrink-0 gap-3">
        <a id="mm-drill-back" href="#" class="text-xs font-bold text-blue-600 hover:underline">← 返回团队详情</a>
        <h1 class="text-lg font-bold text-slate-800">按 UID 展开 · 日资产与盈亏</h1>
    </header>
    <div class="flex-1 overflow-y-auto p-5 space-y-4">
        <section class="card overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
                <p id="mm-drill-meta" class="text-[11px] text-slate-500 font-bold"></p>
                <button type="button" id="mm-drill-download" class="px-4 py-2 border border-slate-200 rounded-lg text-[11px] font-black text-slate-700 hover:bg-slate-50">下载 CSV</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left min-w-[1000px] text-[11px]">
                    <thead class="bg-slate-50 text-[10px] font-bold text-slate-500 uppercase border-b border-slate-100">
                    <tr>
                        <th class="px-4 py-3">UID</th>
                        <th class="px-4 py-3 text-right">总资产</th>
                        <th class="px-4 py-3 text-right">占用保证金</th>
                        <th class="px-4 py-3 text-right">已实现</th>
                        <th class="px-4 py-3 text-right">充值</th>
                        <th class="px-4 py-3 text-right">提现</th>
                        <th class="px-4 py-3 text-right">净充值</th>
                    </tr>
                    </thead>
                    <tbody id="mm-drill-tbody"></tbody>
                </table>
            </div>
            <div id="mm-drill-pagination"></div>
        </section>
    </div>
</main>

<script src="admin-pagination.js"></script>
<script src="admin-mm-team-store.js?v=20261110-mm-polish3"></script>
<script src="admin-mm-dashboard.js?v=20261110-mm-polish3"></script>
<script src="admin-sidebar.js?v=20261110-mm-polish3"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        AdminMmDashboard.initAssetDrillPage();
    });
</script>
</body>
</html>
