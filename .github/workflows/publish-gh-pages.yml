# 原型站发布：configure-pages + deploy-pages。
# Pages 必须为 GitHub Actions 源（非 Deploy from a branch），否则会与内置
# pages-build-deployment 双跑并在 Actions 里卡住 deployment_queued。
# 部署记录见 /deployments，不是 Settings → Environments 列表页。
name: Deploy prototype to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 需仓库管理员权限；403 时请到 Settings → Pages 手动选 GitHub Actions
      - name: Force Pages workflow deployment source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if curl -fsSL \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}'; then
            echo "Pages build_type set to workflow"
          else
            echo "::warning::无法通过 API 切换 Pages 源（需管理员）。请到 Settings → Pages → Source 选 GitHub Actions，并取消 Actions 里正在跑的 pages-build-deployment。"
          fi

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.idea' \
            --exclude 'node_modules' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
